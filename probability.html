<!doctype html><html><head><meta charset="utf-8"><title>Snow Squall Probability Evolution</title><style>body{margin:0;background:#0b1118;color:#e8eef5;font:14px system-ui;padding:22px}h1{margin-top:0}.chart{height:420px;background:#111b26;border:1px solid #2a3948;border-radius:8px;padding:12px}svg{width:100%;height:100%}.note{color:#9eb0c0;margin-top:12px}.axis{stroke:#526579}.line{fill:none;stroke:#57b8ff;stroke-width:4}.point{fill:#fff}.grid{stroke:#263746}.badge{display:inline-block;background:#26384a;border-radius:5px;padding:6px 9px;margin-right:7px}</style></head><body><h1>Probability Evolution</h1><div><span class="badge" id="case">Loading…</span><span class="badge">30-minute target</span></div><div class="chart"><svg viewBox="0 0 1000 400" preserveAspectRatio="none"><g id="grid"></g><polyline id="line" class="line" points=""></polyline><g id="points"></g></svg></div><div class="note" id="note">The probability series is intentionally blank until the trained model exists. This viewer is already wired to the same object timeline so historical model probabilities can be replayed without future-information leakage.</div><script>Promise.all([fetch("data/manifest.json").then(r=>r.json()),fetch("data/objects.geojson").then(r=>r.json())]).then(([m,g])=>{document.getElementById("case").textContent=m.case_id+" • "+m.radar_site;const by={};g.features.forEach(f=>{const id=f.properties.track_id;(by[id]??=[]).push(f)});const id=m.track_ids[0];const fs=(by[id]||[]).sort((a,b)=>a.properties.timestamp.localeCompare(b.properties.timestamp));const vals=fs.map(f=>f.properties.probability_30min).filter(v=>v!=null);if(vals.length){const pts=fs.filter(f=>f.properties.probability_30min!=null);const max=Math.max(...pts.map(f=>f.properties.probability_30min),1);document.getElementById("line").setAttribute("points",pts.map((f,i)=>((i/(pts.length-1||1))*980+10)+","+(390-(f.properties.probability_30min/max)*360)).join(" "));document.getElementById("note").textContent="Clicking a time in the operational viewer will eventually synchronize this history with the radar/object state."}}).catch(e=>document.getElementById("note").textContent=e)</script></body></html>
