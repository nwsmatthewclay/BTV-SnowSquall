name: Discover Modern Snow Squall Candidates

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/modern-discovery-trigger
  workflow_dispatch:
    inputs:
      start_year:
        description: "First year to search"
        required: false
        default: "2019"
      end_year:
        description: "Last year to search"
        required: false
        default: "2026"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests boto3

      - name: Discover KBTV Snow Squall Warnings
        run: |
          python scripts/discover_modern_sqw_candidates.py             --start-year ${{ inputs.start_year || '2019' }}             --end-year ${{ inputs.end_year || '2026' }}             --output data/derived/modern_sqw_candidate_review.csv

      - name: Cluster warnings into storm episodes
        run: |
          python scripts/cluster_modern_sqw_candidates.py             --input data/derived/modern_sqw_candidate_review.csv             --output data/derived/modern_sqw_candidate_episodes.csv

      - name: Build independent validation sampling frame
        run: |
          python scripts/build_modern_validation_sampling_frame.py             --input data/derived/modern_sqw_candidate_episodes.csv             --output data/derived/modern_validation_sampling_frame.csv

      - name: Build outcome-blind reconstruction cohort
        run: |
          python scripts/build_modern_reconstruction_cohort.py             --frame data/derived/modern_validation_sampling_frame.csv             --existing-cases data/manifests/modern_independent_validation_cases.csv             --output data/derived/modern_reconstruction_cohort.csv

      - name: Preflight two-radar Level-II coverage
        run: |
          python scripts/preflight_modern_reconstruction_cohort.py             --cohort data/derived/modern_reconstruction_cohort.csv             --output data/derived/modern_reconstruction_archive_preflight.csv

      - name: Upload candidate review table
        uses: actions/upload-artifact@v4
        with:
          name: modern-sqw-candidate-review
          path: |
            data/derived/modern_sqw_candidate_review.csv
            data/derived/modern_sqw_candidate_episodes.csv
            data/derived/modern_validation_sampling_frame.csv
            data/derived/modern_reconstruction_cohort.csv
            data/derived/modern_reconstruction_archive_preflight.csv
          if-no-files-found: error
