name: Snow Squall Pilot Label Diagnostic

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/diagnostic-trigger
      - scripts/audit_pilot_labels.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Locate latest successful pilot
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MIN_SHA="626048af263afaef735118e653aecc3ae884ff75"
          RUNS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=snow-squall-model-foundation&per_page=100" |
            jq -c '[.workflow_runs[] | select(.name=="Object Dataset Pilot" and .conclusion=="success")] | sort_by(.id) | reverse')
          SELECTED=""
          for RUN in $(printf '%s' "${RUNS}" | jq -c '.[]'); do
            SHA=$(printf '%s' "${RUN}" | jq -r '.head_sha')
            if git merge-base --is-ancestor "${MIN_SHA}" "${SHA}"; then
              SELECTED="${RUN}"
              break
            fi
          done
          test -n "${SELECTED}" || { echo "No successful Object Dataset Pilot is descended from repaired geolocation lineage ${MIN_SHA}."; exit 1; }
          echo "run_id=$(printf '%s' "${SELECTED}" | jq -r '.id')" >> "${GITHUB_OUTPUT}"
          echo "Using repaired-lineage pilot run $(printf '%s' "${SELECTED}" | jq -r '.id') at $(printf '%s' "${SELECTED}" | jq -r '.head_sha')"

      - name: Download completed pilot artifact
        uses: actions/download-artifact@v4
        with:
          name: object-population-pilot
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: pilot_artifact

      - name: Audit positive labels by case
        run: |
          python -m pip install pandas
          python scripts/audit_pilot_labels.py             pilot_artifact/derived/positive_object_labeled.csv             --cases pilot_artifact/manifests/banacos_positive_pilot.csv             --output pilot_label_distribution.json

      - name: Upload compact diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-pilot-label-diagnostic
          path: pilot_label_distribution.json
