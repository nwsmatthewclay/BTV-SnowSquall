name: Snow Squall Live Object Worker Test

on:
  workflow_dispatch:

jobs:
  live-object-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Run live object worker
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/live_object_worker.py             --radar KCXX             --poll-seconds 10             --max-polls 3

      - name: Validate live object products
        run: |
          test -f data/derived/live_tracker_state.json
          test -f data/derived/live_objects.geojson
          test -f data/derived/live_object_history.jsonl
          test -f data/derived/live_object_history.csv
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("data/derived/live_tracker_state.json").read_text())
          geo = json.loads(Path("data/derived/live_objects.geojson").read_text())

          print("Last source:", state.get("last_source"))
          print("Last scan:", state.get("last_scan_time_utc"))
          print("Object count:", state.get("last_object_count"))
          print("GeoJSON features:", len(geo.get("features", [])))
          print("Probability status:", geo.get("metadata", {}).get("probability_status"))
          print("Environment status:", geo.get("metadata", {}).get("environment_status"))
          for feature in geo.get("features", []):
              env = feature["properties"].get("environment", {})
              print("Object", feature["properties"]["track_id"], "RAP:", env.get("source_valid_time_utc"), env.get("status"))

          assert state.get("last_source")
          assert "last_scan_time_utc" in state
          assert geo["type"] == "FeatureCollection"
          assert geo["metadata"]["probability_status"] == "not_scored"
          for feature in geo.get("features", []):
              props = feature["properties"]
              for field in ("length_km", "width_km", "aspect_ratio", "motion_direction_deg", "reflectivity_trend_dbz_per_hr", "area_growth_fraction", "environment_status"):
                  assert field in props
          print("Diagnostic schema validation: PASS")
          history = Path("data/derived/live_object_history.jsonl").read_text().splitlines()
          assert history, "Object history is empty"
          history_rows = [json.loads(line) for line in history if line.strip()]
          assert history_rows, "No valid object history rows"
          assert all(row.get("timestamp") and row.get("track_id") for row in history_rows)
          assert all(row.get("label_status") == "unlabeled" for row in history_rows)
          print("Object history records:", len(history_rows))
          assert geo["metadata"]["environment_source"] == "RAP"
          assert geo["metadata"]["environment_status"] == "attached"
          assert any(feature["properties"].get("environment", {}).get("source_valid_time_utc") for feature in geo.get("features", []))
          PY

      - name: Upload live object products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-object-worker-test
          path: |
            logs/
            data/raw/KCXX/
            data/raw/RAP/
            data/derived/live_tracker_state.json
            data/derived/live_objects.geojson
            data/derived/live_object_history.jsonl
            data/derived/live_object_history.csv
