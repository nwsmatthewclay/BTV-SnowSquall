name: Archived Snow Squall Viewer Smoke Test

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/archived-viewer-trigger
  workflow_dispatch:
    inputs:
      case_id:
        description: "Archived case to build"
        required: true
        default: "BTV20060224"
      radar_site:
        description: "Radar site"
        required: true
        default: "KCXX"
        type: choice
        options:
          - KCXX
          - KTYX

permissions:
  contents: read

concurrency:
  group: archived-snow-squall-viewer-smoke
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Resolve requested case
        env:
          CASE_ID: ${{ inputs.case_id || 'BTV20060224' }}
          RADAR: ${{ inputs.radar_site || 'KCXX' }}
        run: |
          python - <<'PY'
          import os
          import pandas as pd
          cases = pd.read_csv("data/manifests/banacos_2014_cases.csv")
          windows = pd.read_csv("data/manifests/banacos_radar_windows.csv")
          case_id = os.environ["CASE_ID"]
          radar = os.environ["RADAR"]
          assert len(cases[cases.case_id.astype(str) == case_id]) == 1, f"Unknown case: {case_id}"
          match = windows[(windows.case_id.astype(str) == case_id) & (windows.radar_site.astype(str) == radar)]
          assert not match.empty, f"No {radar} radar window for {case_id}"
          print(match[["case_id","radar_site","window_start_utc","window_end_utc"]].to_string(index=False))
          PY

      - name: Download archived Level-II
        run: |
          python acquisition/historical_level2.py             --manifest data/manifests/banacos_radar_windows.csv             --case-id "${{ inputs.case_id || 'BTV20060224' }}"             --radar-site "${{ inputs.radar_site || 'KCXX' }}"             --output data/raw/archived_viewer_level2

      - name: Reconstruct archived objects
        run: |
          python scripts/reconstruct_pilot.py             --input data/raw/archived_viewer_level2             --output data/derived/archived_viewer_objects.csv             --error-log data/derived/archived_viewer_errors.csv

      - name: Annotate archived objects
        run: |
          python scripts/annotate_object_population.py             data/derived/archived_viewer_objects.csv             --manifest data/manifests/banacos_radar_windows.csv             --output data/derived/archived_viewer_objects_annotated.csv

      - name: Export archived radar frames
        run: |
          python scripts/export_viewer_radar_frames.py             --manifest data/manifests/banacos_radar_windows.csv             --input data/raw/archived_viewer_level2             --output-dir data/derived/viewer

      - name: Resolve latest successful live-model candidate
        id: model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_run="$(gh run list --workflow "Snow Squall Candidate Model Refresh" --branch snow-squall-model-foundation --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          artifact_name="snow-squall-refreshed-model-bundles"
          if [ -z "$source_run" ] || [ "$source_run" = "null" ]; then
            source_run="$(gh run list --workflow "Snow Squall Expansion Dataset" --branch snow-squall-model-foundation --status success --limit 20 --json databaseId --jq '.[0].databaseId' | head -1 || true)"
            artifact_name="snow-squall-live-model-bundles"
          fi
          test -n "$source_run" && test "$source_run" != "null"
          rm -rf model_bundle
          mkdir -p model_bundle
          gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir model_bundle
          echo "Using $artifact_name from workflow run $source_run"
          find model_bundle -maxdepth 2 -name metrics.json -print | sort

      - name: Replay archived scans through live object scorer
        run: |
          set -euo pipefail
          python scripts/historical_operational_replay.py \
            --case-id "${{ inputs.case_id || 'BTV20060224' }}" \
            --input-dir data/raw/archived_viewer_level2 \
            --output-dir data/derived/operational_replay \
            --state-path data/derived/operational_replay/state.json \
            --model-dir model_bundle

      - name: Build static historical viewer
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/build_static_viewer.py \
            --objects data/derived/archived_viewer_objects_annotated.csv \
            --cases data/manifests/banacos_2014_cases.csv \
            --output-dir data/derived/viewer \
            --frames-root data/derived/viewer \
            --replay-dir data/derived/operational_replay \
            --model-root model_bundle \
            --model-summary model_bundle/snow_squall_candidate_refresh_summary.json

      - name: Validate viewer package
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("data/derived/viewer/data")
          catalog = json.loads((root / "catalog.json").read_text())
          assert catalog["cases"], "Viewer catalog is empty"
          assert catalog["probability_status"] == "research_candidate_scored"
          assert catalog["historical_live_scorer_scored_object_scans"] > 0
          assert catalog["data_status"] == "research_pilot"
          case = catalog["cases"][0]
          assert case["radar_frames"], "No archived radar frames were exported"
          geo = json.loads((root / case["file"]).read_text())
          assert geo["features"], "No reconstructed object features were exported"
          print("Viewer cases:", len(catalog["cases"]))
          print("Object features:", len(geo["features"]))
          print("Radar frames:", len(case["radar_frames"]))
          print("Tracks:", case["track_count"])
          print("Viewer validation: PASS")
          PY

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp viewer/*.html viewer/*.js viewer/*.css _site/
          cp -R data/derived/viewer/data _site/data
          printf 'BTV Snow Squall Archived Viewer Smoke Test\nCase: %s\nRadar: %s\nResearch/pilot historical reconstruction only.\nProbability scoring is exposed as research-only historical live-scorer replay.\n'             "${{ inputs.case_id || 'BTV20060224' }}" "${{ inputs.radar_site || 'KCXX' }}" > _site/README.txt

      - name: Upload static viewer package
        uses: actions/upload-artifact@v4
        with:
          name: archived-snow-squall-viewer-site
          path: _site

      - name: Upload diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: archived-viewer-smoke
          path: |
            data/derived/archived_viewer_objects.csv
            data/derived/archived_viewer_objects_annotated.csv
            data/derived/archived_viewer_errors.csv
            data/derived/viewer
