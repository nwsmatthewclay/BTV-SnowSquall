name: Snow Squall Live Radar Publisher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snow-squall-live-radar.yml"

permissions:
  contents: write

concurrency:
  group: snow-squall-live-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: \${{ github.workspace }}

    steps:
      - name: Check out model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install radar dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Restore current live radar branch
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin snow-squall-live-data
          mkdir -p viewer/data/live
          git archive origin/snow-squall-live-data viewer/data/live/radar_history viewer/data/live/radar_mosaic.json viewer/data/live/radar_mosaic_clean.png viewer/data/live/radar_mosaic_raw.png viewer/data/live/radar_cursor.json > /tmp/live-radar.tar || true
          if [ -s /tmp/live-radar.tar ]; then
            tar -xf /tmp/live-radar.tar -C .
          fi
          mkdir -p data/raw

      - name: Acquire and render fresh radar
        run: |
          set -euo pipefail
          python scripts/publish_live_radar_only.py \
            --raw-root data/raw \
            --output-root viewer/data/live \
            --max-age-minutes 20

      - name: Archive rolling radar frame
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("viewer/data/live")
          history = root / "radar_history"
          history.mkdir(parents=True, exist_ok=True)
          manifest_path = history / "manifest.json"

          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except Exception:
              manifest = {"version": 1, "retention_frames": 18, "frames": []}

          payload = json.loads((root / "radar_mosaic.json").read_text(encoding="utf-8"))
          times = [s.get("scan_time_utc") for s in payload.get("sources", []) if s.get("scan_time_utc")]
          if not times:
              raise SystemExit("No radar timestamps available.")

          timestamp = max(times)
          safe = re.sub(r"[^0-9]", "", timestamp)[:14]
          image = root / "radar_mosaic_clean.png"
          if not image.exists():
              raise SystemExit("Fresh radar image was not generated.")

          frame_name = f"mosaic_{safe}.png"
          shutil.copy2(image, history / frame_name)

          velocities = {}
          for site in ("KCXX", "KTYX"):
              velocity = root / f"{site}_base_velocity_clean.png"
              if velocity.exists():
                  velocity_name = f"{site}_velocity_{safe}.png"
                  shutil.copy2(velocity, history / velocity_name)
                  velocities[site] = velocity_name

          frames = [
              item for item in manifest.get("frames", [])
              if item.get("timestamp") != timestamp
          ]
          frames.append({
              "timestamp": timestamp,
              "image": f"radar_history/{frame_name}",
              "bounds": payload.get("bounds"),
              "velocity": velocities,
          })
          frames.sort(key=lambda item: item.get("timestamp", ""))
          frames = frames[-18:]

          keep = {Path(item["image"]).name for item in frames}
          keep.update(
              Path(name).name
              for item in frames
              for name in (item.get("velocity") or {}).values()
          )
          for old in history.glob("*.png"):
              if old.name not in keep:
                  old.unlink(missing_ok=True)

          manifest = {
              "version": 1,
              "retention_frames": 18,
              "interval_hint_minutes": 5,
              "updated_utc": datetime.now(timezone.utc).isoformat(),
              "frames": frames,
          }
          manifest_path.write_text(
              json.dumps(manifest, indent=2) + "\\n",
              encoding="utf-8",
          )
          print("Archived", len(frames), "radar frames; newest", timestamp)
          PY

      - name: Validate radar freshness
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path("viewer/data/live/radar_mosaic.json").read_text(encoding="utf-8"))
          now = datetime.now(timezone.utc)
          times = [
              datetime.fromisoformat(str(item["scan_time_utc"]).replace("Z", "+00:00")).astimezone(timezone.utc)
              for item in payload.get("sources", [])
              if item.get("scan_time_utc")
          ]
          if not times:
              raise SystemExit("No radar source timestamps.")
          newest = max(times)
          age = (now - newest).total_seconds() / 60.0
          print(f"Newest radar scan: {newest.isoformat()} age={age:.1f} minutes")
          if age > 20:
              raise SystemExit(f"Radar is stale: {age:.1f} minutes")
          PY

      - name: Publish radar files without replacing object feeds
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/live-publish
          git clone --depth 1 --branch snow-squall-live-data \
            "https://x-access-token:\${GH_TOKEN}@github.com/\${GITHUB_REPOSITORY}.git" \
            /tmp/live-publish

          target=/tmp/live-publish/viewer/data/live
          mkdir -p "$target"

          cp viewer/data/live/radar_mosaic.json "$target/"
          cp viewer/data/live/radar_mosaic.png "$target/"
          cp viewer/data/live/radar_mosaic_clean.png "$target/"
          cp viewer/data/live/radar_mosaic_raw.png "$target/"
          cp viewer/data/live/radar_cursor.json "$target/"
          cp viewer/data/live/radar_mosaic_native_clean.png "$target/" 2>/dev/null || true
          cp viewer/data/live/radar_mosaic_native_raw.png "$target/" 2>/dev/null || true

          for site in KCXX KTYX; do
            for suffix in base_reflectivity_clean.png base_reflectivity_raw.png base_velocity_clean.png base_velocity_raw.png; do
              file="$site"_$suffix
              [ -f "viewer/data/live/$file" ] && cp "viewer/data/live/$file" "$target/$file"
            done
          done

          rm -rf "$target/radar_history"
          cp -R viewer/data/live/radar_history "$target/"

          cd /tmp/live-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/data/live
          if git diff --cached --quiet; then
            echo "No radar changes to publish."
            exit 0
          fi
          newest="$(python - <<'PY'
          import json
          p=json.load(open("/home/runner/work/BTV-SnowSquall/BTV-SnowSquall/viewer/data/live/radar_mosaic.json"))
          print(max(s["scan_time_utc"] for s in p.get("sources",[]) if s.get("scan_time_utc")))
          PY
          )"
          git commit -m "Publish fresh KCXX KTYX radar $newest"
          git push origin HEAD:snow-squall-live-data
