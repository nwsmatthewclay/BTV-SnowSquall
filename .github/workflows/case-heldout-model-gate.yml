name: Case-Held-Out Model Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Snow Squall Expansion Dataset
    types:
      - completed
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/model-gate-trigger

permissions:
  actions: read
  contents: read

jobs:
  train-and-evaluate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight ML stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Locate latest successful expansion feature artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          else
            RUN_ID="$(gh run list --workflow "snow-squall-expansion-dataset.yml" --branch snow-squall-model-foundation --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "${RUN_ID}" && test "${RUN_ID}" != "null"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "Using expansion dataset run ${RUN_ID}"
      - name: Download expansion feature artifact only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/derived/input
          ARTIFACT_ID="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${{ steps.source.outputs.run_id }}/artifacts?per_page=100" -q '.artifacts[] | select(.name=="snow-squall-expansion-feature-batch" and .expired==false) | .id' | head -1)
          test -n "${ARTIFACT_ID}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -o /tmp/expansion_features.zip "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          unzip -q /tmp/expansion_features.zip -d data/derived/input
          find data/derived/input -maxdepth 4 -type f | sort
      - name: Verify training input
        run: |
          test -f data/derived/input/data/derived/snow_squall_model_features_cumulative.csv
          python - <<'PY'
          import pandas as pd
          p = "data/derived/input/data/derived/object_model_features_pilot.csv"
          d = pd.read_csv(p)
          print("TRAINING INPUT RECORDS:", len(d))
          print("TRAINING INPUT COLUMNS:", len(d.columns))
          print("CASES:", d["case_id"].nunique() if "case_id" in d else "missing")
          assert "future_information_policy" in d.columns
          PY

      - name: Run four-horizon event-held-out gate
        run: |
          python scripts/train_case_heldout_models.py \
            data/derived/input/data/derived/object_model_features_pilot.csv \
            --output-dir data/derived/model_gate

      - name: Upload model gate
        uses: actions/upload-artifact@v4
        with:
          name: case-held-out-model-gate
          path: |
            data/derived/model_gate/metrics.json
            data/derived/model_gate/metrics.csv
            data/derived/model_gate/models.joblib
