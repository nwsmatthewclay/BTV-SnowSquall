name: Case-Held-Out Model Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Snow Squall Expansion Dataset
      - Historical Benchmark Acquisition
    types:
      - completed
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/model-gate-trigger

permissions:
  actions: read
  contents: read

jobs:
  train-and-evaluate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight ML stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Locate completed historical benchmark batches
        id: historical
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "run_id=" >> "$GITHUB_OUTPUT"
          for run_id in $(gh run list --workflow "Historical Benchmark Acquisition" --branch main --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            artifacts="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            a0="$(printf '%s' "$artifacts" | jq -r '[.artifacts[] | select(.expired==false and .name=="historical-benchmark-batch-0") | .id][0] // empty')"
            a1="$(printf '%s' "$artifacts" | jq -r '[.artifacts[] | select(.expired==false and .name=="historical-benchmark-batch-1") | .id][0] // empty')"
            a2="$(printf '%s' "$artifacts" | jq -r '[.artifacts[] | select(.expired==false and .name=="historical-benchmark-batch-2") | .id][0] // empty')"
            if [ -n "$a0" ] && [ -n "$a1" ] && [ -n "$a2" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "artifact_0=$a0" >> "$GITHUB_OUTPUT"
              echo "artifact_1=$a1" >> "$GITHUB_OUTPUT"
              echo "artifact_2=$a2" >> "$GITHUB_OUTPUT"
              echo "Using complete historical benchmark acquisition run $run_id"
              exit 0
            fi
          done
          echo "No complete successful historical benchmark run with all 3 labeled batch artifacts. Refusing to train on stale or unrelated feature artifacts."
          exit 1
      - name: Download historical benchmark batches
        if: steps.historical.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for batch in 0 1 2; do
            artifact_id="${{ steps.historical.outputs.artifact_0 }}"
            [ "$batch" = "0" ] || artifact_id="${{ steps.historical.outputs.artifact_1 }}"
            [ "$batch" != "2" ] || artifact_id="${{ steps.historical.outputs.artifact_2 }}"
            mkdir -p "data/derived/input/historical_batch_${batch}"
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              -o "/tmp/historical_batch_${batch}.zip" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip"
            unzip -q "/tmp/historical_batch_${batch}.zip" -d "data/derived/input/historical_batch_${batch}"
          done
          find data/derived/input/historical_batch_* -type f -name 'positive_object_labeled.csv' -print
      - name: Merge labeled historical batches and build forecast-time features
        if: steps.historical.outputs.run_id != ''
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          files = sorted(Path("data/derived/input").glob("historical_batch_*/**/positive_object_labeled.csv"))
          if len(files) != 3:
              raise SystemExit(f"Expected 3 labeled batch files, found {len(files)}: {files}")
          frames = [pd.read_csv(p, low_memory=False) for p in files]
          combined = pd.concat(frames, ignore_index=True)
          if "scan_time_utc" not in combined or "case_id" not in combined:
              raise SystemExit("Historical labeled table lacks scan_time_utc or case_id.")
          combined.to_csv("data/derived/input/historical_labeled_all.csv", index=False)
          print("Historical labeled rows:", len(combined))
          print("Cases:", combined["case_id"].nunique())
          for h in (15, 30, 45, 60):
              col = f"squall_onset_within_{h}m"
              if col in combined:
                  y = pd.to_numeric(combined[col], errors="coerce")
                  print(col, "known=", int(y.notna().sum()), "positive=", int((y == 1).sum()), "negative=", int((y == 0).sum()))
          PY
          python scripts/build_model_features.py data/derived/input/historical_labeled_all.csv \
            --output data/derived/input/rebuilt_model_features.csv \
            --schema-output data/derived/input/rebuilt_model_features.schema.json
      - name: Resolve training feature table
        id: feature_table
        run: |
          set -euo pipefail
          path="data/derived/input/rebuilt_model_features.csv"
          test -s "$path" || { echo "Missing rebuilt features from merged, labeled historical acquisition batches."; exit 1; }
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Training feature table (fresh historical acquisition only): $path"
      - name: Verify training input
        run: |
          test -f "${{ steps.feature_table.outputs.path }}"
          python - <<'PY'
          import pandas as pd
          p = "${{ steps.feature_table.outputs.path }}"
          d = pd.read_csv(p)
          print("TRAINING INPUT RECORDS:", len(d))
          print("TRAINING INPUT COLUMNS:", len(d.columns))
          print("CASES:", d["case_id"].nunique() if "case_id" in d else "missing")
          required = {"future_information_policy", "case_id", "label_status", "track_event_associated"}
          missing = sorted(required - set(d.columns))
          if missing:
              raise SystemExit(f"Training input missing required provenance/label columns: {missing}")
          targets = [f"squall_onset_within_{h}m" for h in (15, 30, 45, 60)]
          missing_targets = [c for c in targets if c not in d.columns]
          if missing_targets:
              raise SystemExit(f"Training input missing onset targets: {missing_targets}")
          print("LABELLED TARGET COVERAGE:")
          for target in targets:
              y = pd.to_numeric(d[target], errors="coerce")
              print(target, {"known": int(y.notna().sum()), "positive": int((y == 1).sum()), "negative": int((y == 0).sum())})
          if not any(pd.to_numeric(d[c], errors="coerce").notna().any() for c in targets):
              raise SystemExit("No known onset labels found; refusing to train.")
          PY
      - name: Generate detailed historical label-quality report
        if: always() && steps.feature_table.outputs.path != ''
        run: |
          mkdir -p data/derived/model_gate
          python scripts/audit_training_dataset.py "${{ steps.feature_table.outputs.path }}" \
            --report data/derived/model_gate/training_data_quality.json \
            --report-only

      - name: Run four-horizon event-held-out gate
        run: |
          python scripts/train_case_heldout_models.py \
            "${{ steps.feature_table.outputs.path }}" \
            --output-dir data/derived/model_gate

      - name: Fit research-only horizon calibrators from held-out predictions
        if: always() && hashFiles('data/derived/model_gate/oof_predictions.csv') != ''
        run: |
          python scripts/calibrate_model_bundle.py \
            --model-dir data/derived/model_gate

      - name: Compare model families on common held-out folds
        run: |
          set -euo pipefail
          python scripts/model_family_compare.py \
            "${{ steps.feature_table.outputs.path }}" \
            --output-dir data/derived/model_family_comparison

      - name: Require actual labeled evaluation before passing the gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          trained = json.loads(Path("data/derived/model_gate/metrics.json").read_text())
          compared = json.loads(Path("data/derived/model_family_comparison/metrics.json").read_text())
          train_ok = [h for h, m in trained.items() if m.get("status") == "ok" and m.get("folds")]
          family_ok = []
          for h, m in compared.get("horizons", {}).items():
              models = m.get("models", {})
              if m.get("status") == "ok" and m.get("folds") and sum(v.get("status") == "ok" for v in models.values()) >= 2:
                  family_ok.append(h)
          print("Horizons with valid case-held-out training metrics:", train_ok)
          print("Horizons with valid common-fold model comparisons:", family_ok)
          if not train_ok or not family_ok:
              raise SystemExit(
                  "MODEL GATE FAILED: no valid labeled, held-out evaluation. "
                  "Do not treat artifact creation or workflow completion as successful training."
              )
          PY

      - name: Upload model gate
        uses: actions/upload-artifact@v4
        with:
          name: case-held-out-model-gate
          path: |
            data/derived/model_gate/metrics.json
            data/derived/model_gate/metrics.csv
            data/derived/model_gate/models.joblib
            data/derived/model_gate/oof_predictions.csv
            data/derived/model_gate/calibration_report.json
            data/derived/model_gate/probability_calibrators_research.joblib
            data/derived/model_gate/training_data_quality.json
            data/derived/model_family_comparison/metrics.json
