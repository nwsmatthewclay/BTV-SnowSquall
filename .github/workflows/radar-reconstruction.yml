name: Radar Reconstruction Pilot

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Banacos case ID"
        required: true
        default: "BTV20060224"
      radar_site:
        description: "Radar site"
        required: true
        default: "KCXX"

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-science.txt

      - name: Download historical Level-II
        run: |
          python acquisition/historical_level2.py \
            --manifest data/manifests/banacos_radar_windows.csv \
            --output data/raw/level2 \
            --case-id "${{ inputs.case_id }}"

      - name: Restrict to requested radar
        run: |
          mkdir -p data/raw/level2_filtered
          if [ -d "data/raw/level2/${{ inputs.radar_site }}" ]; then
            cp -R "data/raw/level2/${{ inputs.radar_site }}" data/raw/level2_filtered/
          else
            echo "Requested radar directory not found"
            exit 1
          fi

      - name: Reconstruct geographic objects
        run: |
          python scripts/reconstruct_pilot.py \
            --input data/raw/level2_filtered \
            --output "data/derived/${{ inputs.case_id }}_${{ inputs.radar_site }}_object_scans.csv"

      - name: Create track visualization
        run: |
          python scripts/plot_pilot_track.py \
            "data/derived/${{ inputs.case_id }}_${{ inputs.radar_site }}_object_scans.csv" \
            --output "data/derived/${{ inputs.case_id }}_${{ inputs.radar_site }}_track.png"

      - name: Export live-style objects
        run: |
          python scripts/export_live_objects.py \
            "data/derived/${{ inputs.case_id }}_${{ inputs.radar_site }}_object_scans.csv" \
            --output "data/derived/${{ inputs.case_id }}_${{ inputs.radar_site }}_objects.geojson"

      - name: Upload reconstruction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ inputs.case_id }}-${{ inputs.radar_site }}-reconstruction"
          path: |
            data/derived/*.csv
            data/derived/*.png
            data/derived/*.geojson
          if-no-files-found: warn
