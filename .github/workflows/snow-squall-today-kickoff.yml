name: Snow Squall Today Kickoff

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/today-kickoff-trigger
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: snow-squall-today-kickoff
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Launch independent historical acquisitions in parallel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run --repo "$GITHUB_REPOSITORY" "Snow Squall Case Discovery" --ref snow-squall-model-foundation
          gh workflow run --repo "$GITHUB_REPOSITORY" "Snow Squall IEM LSR Harvest" --ref snow-squall-model-foundation
          gh workflow run --repo "$GITHUB_REPOSITORY" "Snow Squall NWS Text Review" --ref snow-squall-model-foundation
          gh workflow run --repo "$GITHUB_REPOSITORY" "Acquire Penn State Schneider 2024 Case Catalog" --ref snow-squall-model-foundation
          # The legacy full-object workflow is not exposed from the default branch.
          # Launch the current chained expansion workflow instead; it uses the foundation
          # branch code and retains the archived 30/15 batch offsets.
          gh workflow run snow-squall-expansion-dataset.yml             --repo "$GITHUB_REPOSITORY"             --ref snow-squall-model-foundation             -f archive_override=true             -f official_offset=30             -f unverified_offset=15             -f max_official=30             -f max_unverified=15
          echo "Dispatched discovery, LSR, NWS text, PSU catalog, and archived squall expansion."
          echo "Snow Squall Expansion Dataset will begin automatically from the successful unified ledger."
