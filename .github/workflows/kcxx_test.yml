name: KCXX Real-Time Test

on:
  workflow_dispatch:

jobs:
  kcxx-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run KCXX watcher
        run: |
          python acquisition/radar_watcher.py --radar KCXX --poll-seconds 10

      - name: Upload KCXX logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcxx-test-logs
          path: |
            logs/
            data/raw/KCXX/
