name: KCXX Real-Time Test

on:
  workflow_dispatch:

jobs:
  kcxx-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run KCXX watcher
        run: |
          # Run long enough to demonstrate multiple polls and any newly
          # available volume, but finish cleanly in CI.
          python acquisition/radar_watcher.py             --radar KCXX             --poll-seconds 10             --max-polls 12

      - name: Verify acquired volumes
        run: |
          test -d data/raw/KCXX
          count=$(find data/raw/KCXX -maxdepth 1 -type f -size +0c | wc -l)
          echo "Valid KCXX local volumes: $count"
          test "$count" -ge 1

      - name: Upload KCXX logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcxx-test-logs
          path: |
            logs/
            data/raw/KCXX/
