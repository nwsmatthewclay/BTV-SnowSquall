name: Snow Squall Historical Repair Launcher

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/historical-repair-trigger
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: snow-squall-historical-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch corrected PSU catalog acquisition
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run --repo "$GITHUB_REPOSITORY" "Acquire Penn State Schneider 2024 Case Catalog" --ref snow-squall-model-foundation
      - name: Dispatch full object expansion by workflow file
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The full object expansion workflow is exposed from the default branch.
          # Run it against the foundation branch so it uses today's code.
          gh workflow run snow-squall-expansion-dataset.yml             --repo "$GITHUB_REPOSITORY"             --ref snow-squall-model-foundation             -f archive_override=true             -f official_offset=30             -f unverified_offset=15             -f max_official=30             -f max_unverified=15
          echo "Dispatched Snow Squall Expansion Dataset at archived offsets 30/15"
