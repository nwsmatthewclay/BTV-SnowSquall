name: Snow Squall Tracker Quality CI

on:
  push:
    branches:
      - tracker-quality-v1
  pull_request:
    branches:
      - snow-squall-model-foundation
    paths:
      - processing/object_tracker.py
      - scripts/build_object_track_catalog.py
      - scripts/track_quality_gate.py
      - scripts/reconstruct_pilot.py
      - scripts/process_live_volume.py
      - scripts/live_model_features.py
      - scripts/append_live_object_history.py
      - scripts/build_model_features.py
      - schema/live_object_schema.json
      - tests/test_object_tracker*.py
      - tests/test_object_track_catalog*.py
      - tests/test_track_quality_gate.py
      - tests/test_track_identity.py
      - tests/test_track_quality_feature_parity.py

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-science.txt

      - name: Run tracker and track-quality tests
        run: |
          pytest -q \
            tests/test_object_tracker.py \
            tests/test_object_tracker_assignment.py \
            tests/test_object_tracker_diagnostics.py \
            tests/test_object_tracker_stale.py \
            tests/test_object_track_catalog.py \
            tests/test_object_track_catalog_qc.py \
            tests/test_track_identity.py \
            tests/test_track_quality_feature_parity.py \
            tests/test_track_quality_gate.py

      - name: Validate tracker module imports
        run: |
          python - <<'PY'
          from processing.object_tracker import CentroidTracker, TrackerConfig
          from scripts.build_object_track_catalog import build_track_catalog
          from scripts.track_quality_gate import apply_track_quality_gate
          print("Tracker imports OK")
          print("Tracker config:", TrackerConfig())
          PY
