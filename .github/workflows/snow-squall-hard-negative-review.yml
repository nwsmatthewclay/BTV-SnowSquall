name: Snow Squall Hard Negative Review Queue

on:
  workflow_run:
    workflows:
      - Snow Squall Expansion Dataset
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: snow-squall-hard-negative-review
  cancel-in-progress: true

jobs:
  build-queue:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out model-foundation code
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Resolve expansion run
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="$(gh run list               --workflow "Snow Squall Expansion Dataset"               --branch snow-squall-model-foundation               --status success               --limit 1               --json databaseId               --jq '.[0].databaseId')"
          fi
          test -n "$run_id" && test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download cumulative feature batch
        uses: actions/download-artifact@v4
        with:
          name: snow-squall-expansion-feature-batch
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.run.outputs.run_id }}
          path: feature_artifact

      - name: Download expansion research package
        uses: actions/download-artifact@v4
        with:
          name: snow-squall-expansion-research-package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.run.outputs.run_id }}
          path: research_artifact

      - name: Locate cumulative features
        id: input
        run: |
          set -euo pipefail
          features="$(find feature_artifact -name snow_squall_model_features_cumulative.csv -type f -print -quit)"
          test -n "$features"
          echo "features=$features" >> "$GITHUB_OUTPUT"

      - name: Locate null-window surface evidence
        id: surface
        run: |
          set -euo pipefail
          surface_root="$(find research_artifact -type d -name 'ASOS_IEM_null_expansion' -print -quit || true)"
          echo "surface_root=$surface_root" >> "$GITHUB_OUTPUT"
          echo "Null surface root: ${surface_root:-none}"

      - name: Build hard-negative review queue
        run: |
          set -euo pipefail
          args=(
            "${{ steps.input.outputs.features }}"
            --output data/derived/snow_squall_hard_negative_review_queue
          )
          if [ -n "${{ steps.surface.outputs.surface_root }}" ]; then
            args+=(--surface-root "${{ steps.surface.outputs.surface_root }}")
          fi
          python scripts/build_hard_negative_review_queue.py "${args[@]}"

      - name: Build persistent human-review packet
        run: |
          set -euo pipefail
          existing=""
          if [ -f data/reviews/snow_squall_hard_negative_review.csv ]; then
            existing="--existing-review data/reviews/snow_squall_hard_negative_review.csv"
          fi
          python scripts/build_hard_negative_review_packet.py \
            --queue data/derived/snow_squall_hard_negative_review_queue.csv \
            --output data/derived/snow_squall_hard_negative_review_packet.csv \
            --promoted-output data/derived/snow_squall_reviewed_negative_nulls.csv \
            --summary data/derived/snow_squall_hard_negative_review_packet.summary.json \
            $existing

      - name: Build browser review board
        run: |
          python scripts/build_hard_negative_review_board.py \
            --packet data/derived/snow_squall_hard_negative_review_packet.csv \
            --output data/derived/snow_squall_hard_negative_review_board.html

      - name: Persist new review candidates to foundation ledger
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          ledger_path = Path("data/reviews/snow_squall_hard_negative_review.csv")
          packet_path = Path("data/derived/snow_squall_hard_negative_review_packet.csv")
          review_fields = [
              "null_id", "review_status", "final_class",
              "radar_target_present", "event_evidence_present",
              "surface_evidence_interpreted", "reviewer",
              "reviewed_at_utc", "review_notes",
          ]

          existing = (
              pd.read_csv(ledger_path)
              if ledger_path.exists()
              else pd.DataFrame()
          )
          packet = pd.read_csv(packet_path)

          # Keep the complete queue diagnostics alongside reviewer decisions so
          # a promoted negative remains traceable to its radar/object evidence.
          merged = pd.concat([existing, packet], ignore_index=True, sort=False)
          merged["null_id"] = merged["null_id"].fillna("").astype(str).str.strip()
          merged = merged[merged["null_id"].ne("")]
          merged = merged.drop_duplicates("null_id", keep="last")

          for col in review_fields[1:]:
              if col not in merged.columns:
                  merged[col] = ""
              merged[col] = merged[col].fillna("").astype(str).str.strip()

          ledger_path.parent.mkdir(parents=True, exist_ok=True)
          merged.sort_values("null_id").to_csv(ledger_path, index=False)
          print(f"Persistent review ledger rows: {len(merged)}")
          PY

      - name: Commit persistent review ledger
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews/snow_squall_hard_negative_review.csv
          if git diff --cached --quiet; then
            echo "No review-ledger changes to commit."
            exit 0
          fi
          git commit -m "Update hard-negative review ledger"
          git push origin snow-squall-model-foundation

      - name: Upload review queue and promotion packet
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-hard-negative-review
          retention-days: 60
          path: |
            data/derived/snow_squall_hard_negative_review_queue.csv
            data/derived/snow_squall_hard_negative_review_queue.summary.csv
            data/derived/snow_squall_hard_negative_review_packet.csv
            data/derived/snow_squall_hard_negative_review_packet.summary.json
            data/derived/snow_squall_hard_negative_review_board.html
            data/derived/snow_squall_reviewed_negative_nulls.csv
            data/reviews/snow_squall_hard_negative_review.csv
