name: Candidate Model Release Audit

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight ML stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Locate latest successful candidate refresh artifact
        id: source
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --workflow "Snow Squall Candidate Model Refresh" --branch snow-squall-model-foundation --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "${RUN_ID}" && test "${RUN_ID}" != "null"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download candidate refresh bundle
        run: |
          set -euo pipefail
          rm -rf candidate_bundle
          gh run download "${{ steps.source.outputs.run_id }}" --name snow-squall-refreshed-model-bundles --dir candidate_bundle
          find candidate_bundle -maxdepth 5 -type f | sort

      - name: Audit four-horizon candidate package
        run: |
          python scripts/audit_candidate_release.py
            --schema "$(find candidate_bundle -name snow_squall_model_features_expanded.schema.json -type f -print -quit)"
            --model-root "candidate_bundle/data/derived"
            --prefix candidate_ensemble_refresh_
            --output candidate_bundle/candidate_release_audit.json

      - name: Upload candidate release audit
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-candidate-release-audit
          retention-days: 30
          path: candidate_bundle/candidate_release_audit.json
