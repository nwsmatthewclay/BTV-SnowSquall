name: Snow Squall Candidate Model Refresh

on:
  workflow_run:
    workflows:
      - National SQW Radar Pretraining Pool
      - Snow Squall Expansion Dataset
    types:
      - completed
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/model-refresh-trigger
  workflow_dispatch:
    inputs:
      expansion_run_id:
        description: "Successful Snow Squall Expansion Dataset run containing a feature batch; blank uses latest usable."
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: snow-squall-candidate-model-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'push' || (github.event_name == 'workflow_run' && (github.event.workflow_run.name == 'National SQW Radar Pretraining Pool' || github.event.workflow_run.name == 'Snow Squall Expansion Dataset'))
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - name: Resolve optional national model bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf national_pretrain_artifact
          source_run=""
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.name }}" = "National SQW Radar Pretraining Pool" ]; then
            source_run="${{ github.event.workflow_run.id }}"
          else
            source_run="$(gh run list --workflow "National SQW Radar Pretraining Pool" --branch snow-squall-model-foundation --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
          fi
          if [ -z "$source_run" ] || [ "$source_run" = "null" ]; then
            echo "No successful national radar pretraining bundle is available; continuing with BTV-only training."
            exit 0
          fi
          mkdir -p national_pretrain_artifact
          if gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --name national-sqw-radar-model-bundles --dir national_pretrain_artifact; then
            echo "Using lightweight national model bundle from run $source_run"
          elif gh run download "$source_run" --repo "$GITHUB_REPOSITORY" --name national-sqw-radar-pretraining-pool --dir national_pretrain_artifact; then
            echo "Using full national pretraining pool from run $source_run"
          else
            echo "National pretraining artifacts unavailable; continuing with BTV-only training."
            rm -rf national_pretrain_artifact
          fi

      - name: Resolve latest archived expansion feature batch
        id: expansion
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          selected=""
          requested_run="${{ inputs.expansion_run_id }}"
          if [ -n "$requested_run" ]; then
            echo "Checking explicitly requested expansion run $requested_run for feature artifact..."
            rm -rf /tmp/expansion_probe
            if gh run download "$requested_run" --repo "$GITHUB_REPOSITORY" --name snow-squall-expansion-feature-batch --dir /tmp/expansion_probe >/dev/null 2>&1; then
              selected="$requested_run"
              echo "Using explicitly requested expansion run $selected"
            else
              echo "Requested expansion run $requested_run does not contain a usable feature artifact."
              exit 1
            fi
          fi
          if [ -z "$selected" ] && [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.name }}" = "Snow Squall Expansion Dataset" ]; then
            trigger_run="${{ github.event.workflow_run.id }}"
            echo "Checking triggering expansion run $trigger_run for feature artifact..."
            rm -rf /tmp/expansion_probe
            if gh run download "$trigger_run" --repo "$GITHUB_REPOSITORY" --name snow-squall-expansion-feature-batch --dir /tmp/expansion_probe >/dev/null 2>&1; then
              selected="$trigger_run"
              echo "Using triggering expansion run $selected"
            fi
          fi
          if [ -z "$selected" ]; then
            for run_id in $(gh run list --workflow "Snow Squall Expansion Dataset" --branch snow-squall-model-foundation --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
              echo "Checking expansion run $run_id for feature artifact..."
              rm -rf /tmp/expansion_probe
              if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name snow-squall-expansion-feature-batch --dir /tmp/expansion_probe >/dev/null 2>&1; then
                selected="$run_id"
                break
              fi
            done
          fi
          if [ -z "$selected" ]; then
            echo "No usable successful expansion feature batch found."
            exit 1
          fi
          echo "run_id=$selected" >> "$GITHUB_OUTPUT"
          echo "Using archived expansion feature batch from run $selected"
      - name: Download archived expansion feature batch
        run: |
          set -euo pipefail
          rm -rf expansion_artifact
          gh run download "${{ steps.expansion.outputs.run_id }}"             --name snow-squall-expansion-feature-batch             --dir expansion_artifact

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install science dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Stage historical cumulative feature population
        run: |
          set -euo pipefail
          cumulative="$(find expansion_artifact -name 'snow_squall_model_features_cumulative.csv' -type f -print -quit)"
          schema="$(find expansion_artifact -name 'snow_squall_model_features_expanded.schema.json' -type f -print -quit)"
          test -n "${cumulative}"
          test -n "${schema}"
          mkdir -p data/derived
          cp "${cumulative}" data/derived/snow_squall_model_features_cumulative_prior.csv
          cp "${schema}" data/derived/snow_squall_model_features_expanded.schema.json
          echo "Historical cumulative rows:"
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv("data/derived/snow_squall_model_features_cumulative_prior.csv")
          print("rows=",len(d))
          print("columns=",len(d.columns))
          print("case_groups=",d["case_id"].nunique() if "case_id" in d.columns else 0)
          print("null_groups=",d["null_id"].nunique() if "null_id" in d.columns else 0)
          PY

      - name: Enforce radar + environment training contract
        id: contract
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/audit_radar_environment_contract.py             data/derived/snow_squall_model_features_cumulative_prior.csv             --output data/derived/snow_squall_prior_radar_environment_contract_audit.json

      - name: Prepare limited-data bootstrap candidate
        id: mode
        if: steps.contract.outcome != 'success'
        run: |
          set -euo pipefail
          cp data/derived/snow_squall_model_features_cumulative_prior.csv \
            data/derived/snow_squall_model_features_cumulative.csv
          printf '%s\n' '{"status":"national_pretraining_not_available","mode":"limited_data_bootstrap"}' \
            > data/derived/snow_squall_national_pretraining_feature_summary_refresh.json
          echo "candidate_mode=limited_data_bootstrap" >> "$GITHUB_OUTPUT"
          echo "training_contract_status=limited_data_bootstrap" >> "$GITHUB_OUTPUT"
          echo "Limited-data bootstrap mode enabled: training will proceed without the strict first-class base-moment contract."
          echo "This candidate remains research-shadow only."

      - name: Establish candidate training mode
        id: mode
        if: steps.contract.outcome == 'success'
        run: |
          echo "candidate_mode=full_contract" >> "$GITHUB_OUTPUT"
          echo "training_contract_status=full_radar_environment_contract" >> "$GITHUB_OUTPUT"

      - name: Stage optional national pretraining models
        if: steps.contract.outcome == 'success'
        run: |
          set -euo pipefail
          model_file="$(find national_pretrain_artifact -type f -name 'weak_pretraining_model.joblib' -print -quit || true)"
          if [ -z "${model_file}" ]; then
            echo "National pretraining models unavailable; skipping national priors."
            exit 0
          fi
          root="$(dirname "$(dirname "${model_file}")")"
          echo "National model artifact root: ${root}"
          for model_dir in "${root}"/national_sqw_weak_model_*m; do
            [ -d "${model_dir}" ] || continue
            cp -R "${model_dir}" data/derived/
          done

      - name: Apply optional national BTV-excluded radar priors
        if: steps.contract.outcome == 'success'
        run: |
          set -euo pipefail
          if find data/derived -maxdepth 1 -type d -name 'national_sqw_weak_model_*m' -print -quit | grep -q .; then
            python scripts/add_national_pretraining_features.py               --features data/derived/snow_squall_model_features_cumulative_prior.csv               --model-root data/derived               --output data/derived/snow_squall_model_features_cumulative.csv               --summary data/derived/snow_squall_national_pretraining_feature_summary_refresh.json               --schema data/derived/snow_squall_model_features_expanded.schema.json
          else
            cp data/derived/snow_squall_model_features_cumulative_prior.csv               data/derived/snow_squall_model_features_cumulative.csv
            printf '%s\\n' '{"status":"national_pretraining_not_available","mode":"btv_only_candidate"}'               > data/derived/snow_squall_national_pretraining_feature_summary_refresh.json
          fi
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv("data/derived/snow_squall_model_features_cumulative.csv")
          national=[c for c in d.columns if c.startswith("national_pretrain_probability_")]
          print("National prior columns:", national)
          print("augmented_rows=",len(d),"augmented_columns=",len(d.columns))
          PY

      - name: Enforce augmented radar + environment training contract
        if: steps.mode.outputs.candidate_mode == 'full_contract'
        run: |
          set -euo pipefail
          python scripts/audit_radar_environment_contract.py             data/derived/snow_squall_model_features_cumulative.csv             --output data/derived/snow_squall_radar_environment_contract_audit.json

      - name: Train refreshed four-horizon baseline and ensemble candidates
        if: success()
        run: |
          set -euo pipefail
          baseline_args=()
          ensemble_args=()
          if [ "${{ steps.mode.outputs.candidate_mode }}" = "limited_data_bootstrap" ]; then
            baseline_args+=(--allow-limited-data)
            ensemble_args+=(--allow-limited-data)
          fi
          for h in 15 30 45 60; do
            python scripts/train_baseline_model.py \
              data/derived/snow_squall_model_features_cumulative.csv \
              --schema data/derived/snow_squall_model_features_expanded.schema.json \
              --target squall_onset_within_${h}m \
              --output-dir data/derived/baseline_refresh_${h}m \
              "${baseline_args[@]}"

            python scripts/train_candidate_ensemble.py \
              data/derived/snow_squall_model_features_cumulative.csv \
              --schema data/derived/snow_squall_model_features_expanded.schema.json \
              --target squall_onset_within_${h}m \
              --output-dir data/derived/candidate_ensemble_refresh_${h}m \
              "${ensemble_args[@]}"

            python scripts/calibrate_model_bundle.py \
              --model-dir data/derived/candidate_ensemble_refresh_${h}m
          done

      - name: Audit refreshed live compatibility
        if: success()
        run: |
          set -euo pipefail
          rm -rf refresh_model_root
          mkdir -p refresh_model_root
          cp -R data/derived/baseline_refresh_*m refresh_model_root/
          cp -R data/derived/candidate_ensemble_refresh_*m refresh_model_root/
          # The auditor's legacy bundle vocabulary is intentionally reused for
          # a release-package contract; temporarily map refresh names into the
          # expected paths without changing the actual bundle metadata.
          for h in 15 30 45 60; do
            cp -R "data/derived/baseline_refresh_${h}m" "refresh_model_root/baseline_expansion_${h}m"
            cp -R "data/derived/candidate_ensemble_refresh_${h}m" "refresh_model_root/candidate_ensemble_expansion_${h}m"
          done
          python scripts/audit_live_model_compatibility.py             --schema data/derived/snow_squall_model_features_expanded.schema.json             --model-root refresh_model_root             --output data/derived/snow_squall_live_model_compatibility_refresh.json

      - name: Write refresh provenance and comparison
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          out={}
          for h in (15,30,45,60):
              p=Path(f"data/derived/candidate_ensemble_refresh_{h}m/metrics.json")
              m=json.loads(p.read_text())
              out[f"{h}m"]={
                  "training_rows":m.get("training_rows"),
                  "training_groups":m.get("training_groups"),
                  "positive_case_group_count":m.get("positive_case_group_count"),
                  "evaluation_status":m.get("evaluation_status"),
                  "operational_release_status":m.get("operational_release_status"),
                  "metrics":m.get("metrics",{}),
              }
          summary_path = Path("data/derived/snow_squall_candidate_refresh_summary.json")
          prior = {}
          if summary_path.exists():
              try:
                  prior = json.loads(summary_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  prior = {}
          summary = {
              **prior,
              "release_status": "candidate_only_not_operational",
              "candidate_mode": "${{ steps.mode.outputs.candidate_mode }}",
              "training_contract_status": "${{ steps.mode.outputs.training_contract_status }}",
              "national_pretraining_source": (
                  prior.get("national_pretraining_source")
                  or "BTV-excluded national SQW warning/radar weak supervision"
              ),
              "horizons": out,
          }
          summary_path.write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(out,indent=2))
          PY

      - name: Upload refreshed candidate model bundles
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-refreshed-model-bundles
          retention-days: 30
          path: |
            data/derived/candidate_ensemble_refresh_*m
            data/derived/baseline_refresh_*m
            data/derived/snow_squall_candidate_refresh_summary.json
            data/derived/snow_squall_national_pretraining_feature_summary_refresh.json
            data/derived/snow_squall_live_model_compatibility_refresh.json
            data/derived/snow_squall_prior_radar_environment_contract_audit.json
            data/derived/snow_squall_model_features_cumulative.csv
            data/derived/snow_squall_radar_environment_contract_audit.json
            data/derived/snow_squall_model_features_expanded.schema.json
