name: Snow Squall Live Radar Watchdog
# Live publisher recovery watchdog enabled

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snow-squall-live-watchdog.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: snow-squall-live-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Inspect independent radar and object freshness
        id: health
        run: |
          set -euo pipefail
          rm -rf live_data
          mkdir -p live_data
          git fetch --no-tags origin snow-squall-live-data
          git archive origin/snow-squall-live-data viewer/data/live | tar -x -C live_data

          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          now = datetime.now(timezone.utc)
          live = Path("live_data/viewer/data/live")
          radar_stale = True
          radar_age = None
          radar_path = live / "radar_mosaic.json"
          try:
              radar = json.loads(radar_path.read_text(encoding="utf-8"))
              ages = []
              for source in radar.get("sources") or []:
                  raw = source.get("scan_time_utc")
                  if not raw:
                      continue
                  stamp = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
                  if stamp.tzinfo is None:
                      stamp = stamp.replace(tzinfo=timezone.utc)
                  age = (now - stamp.astimezone(timezone.utc)).total_seconds() / 60
                  ages.append(age)
                  print(f"RADAR {source.get('radar')}: age={age:.1f} min")
              if ages:
                  radar_age = max(ages)
                  radar_stale = radar.get("status") != "ready" or radar_age > 12.0
          except (OSError, TypeError, ValueError, json.JSONDecodeError) as exc:
              print(f"RADAR metadata missing/invalid: {exc}")

          stale_sites = []
          object_ages = {}
          for site in ("KCXX", "KTYX"):
              path = live / f"{site}_objects.geojson"
              scan = None
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
                  raw = (payload.get("metadata") or {}).get("scan_time_utc")
                  if raw:
                      scan = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
                      if scan.tzinfo is None:
                          scan = scan.replace(tzinfo=timezone.utc)
                      scan = scan.astimezone(timezone.utc)
              except (OSError, TypeError, ValueError, json.JSONDecodeError):
                  scan = None
              age = ((now - scan).total_seconds() / 60.0) if scan else float("inf")
              object_ages[site] = None if age == float("inf") else round(age, 2)
              print(f"OBJECTS {site}: {scan.isoformat() if scan else 'MISSING'} age={age:.1f} min")
              if age > 22.0:
                  stale_sites.append(site)

          state = {
              "checked_utc": now.isoformat(),
              "radar_stale": radar_stale,
              "radar_age_minutes": None if radar_age is None else round(radar_age, 2),
              "stale_sites": stale_sites,
              "object_ages_minutes": object_ages,
          }
          Path("watchdog_state.json").write_text(json.dumps(state, indent=2), encoding="utf-8")
          print(json.dumps(state, indent=2))
          PY

      - name: Recover stale radar independently and re-arm stale object feed
        run: |
          set -euo pipefail
          radar_stale="$(python - <<'PY'
          import json
          print("yes" if json.load(open("watchdog_state.json"))["radar_stale"] else "no")
          PY
          )"

          if [ "$radar_stale" = "yes" ]; then
            active_radar="$(gh run list \
              --workflow "Snow Squall Radar Frame Publisher" \
              --branch main --limit 20 --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
            if [ "$active_radar" -eq 0 ]; then
              echo "Radar mosaic missing or older than 12 minutes; dispatching independent radar publisher."
              gh workflow run "Snow Squall Radar Frame Publisher" --ref main
            else
              echo "Radar publisher already active ($active_radar run); avoiding duplicate dispatch."
            fi
          else
            echo "Radar mosaic is fresh."
          fi

          stale_sites="$(python - <<'PY'
          import json
          print(",".join(json.load(open("watchdog_state.json"))["stale_sites"]))
          PY
          )"
          if [ -z "$stale_sites" ]; then
            echo "Object products are fresh."
            exit 0
          fi

          active_dispatch="$(gh run list \
            --workflow "Snow Squall Live Publisher Dispatch" \
            --branch main --limit 20 --json status \
            --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')"
          if [ "$active_dispatch" -gt 0 ]; then
            echo "Object publisher dispatcher already active ($active_dispatch run); no duplicate dispatch."
            exit 0
          fi

          last_start="$(gh run list \
            --workflow "Snow Squall Live Publisher Dispatch" \
            --branch main --limit 1 --json startedAt \
            --jq '.[0].startedAt // ""')"
          if [ -n "$last_start" ]; then
            retry_allowed="$(python - "$last_start" <<'PY'
          import sys
          from datetime import datetime, timezone
          started = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00")).astimezone(timezone.utc)
          age = (datetime.now(timezone.utc) - started).total_seconds() / 60.0
          print("yes" if age >= 10 else "no")
          PY
            )"
            if [ "$retry_allowed" != "yes" ]; then
              echo "Recent object dispatcher run; allowing it to settle."
              exit 0
            fi
          fi

          echo "Stale object products detected: $stale_sites"
          gh workflow run "Snow Squall Live Publisher Dispatch" --ref main

      - name: Write watchdog summary
        if: always()
        run: |
          if [ -f watchdog_state.json ]; then
            cat watchdog_state.json
          fi
