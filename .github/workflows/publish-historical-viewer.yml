name: Publish Snow Squall Historical Viewer

on:
  workflow_run:
    workflows:
      - Object Dataset Pilot
      - Object Dataset Full Expansion
    types:
      - completed
    branches:
      - snow-squall-model-foundation

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: snow-squall-viewer-pages
  cancel-in-progress: true

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout viewer source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download source dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.workflow_run.name == 'Object Dataset Full Expansion' && 'object-population-expansion' || 'object-population-pilot' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: pilot_artifact

      - name: Assemble viewer site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp viewer/index.html viewer/app.js viewer/style.css _site/
          python -m py_compile scripts/build_static_viewer.py

          if [ "${{ github.event.workflow_run.name }}" = "Object Dataset Full Expansion" ]; then
            CASES="pilot_artifact/data/manifests/banacos_2014_cases.csv"
          else
            CASES="pilot_artifact/data/manifests/banacos_positive_pilot.csv"
          fi

          python scripts/build_static_viewer.py             --objects pilot_artifact/data/derived/positive_object_labeled.csv             --cases "${CASES}"             --output-dir _site

          cat > _site/README.txt <<'EOF'
          BTV Snow Squall Historical Object Viewer
          Research/pilot historical reconstruction only.
          The viewer does not expose a production probability forecast.
          EOF

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
