name: Publish Snow Squall Historical Viewer

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - viewer/*.html
      - viewer/*.js
      - viewer/*.css
      - scripts/build_static_viewer.py
      - .github/workflows/publish-historical-viewer.yml
      - .github/pilot-trigger
  workflow_run:
    workflows:
      - Snow Squall Expansion Dataset
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: snow-squall-viewer-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout viewer source
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - name: Resolve latest successful dataset workflow run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # The historical viewer is a research/replay surface. Always publish
          # from the newest completed successful dataset rather than blocking on
          # a newer in-progress expansion batch.
          CANDIDATE=$(gh run list             --branch snow-squall-model-foundation             --status success             --limit 30             --json databaseId,name,status,conclusion             --jq '[.[] | select(.name == "Snow Squall Expansion Dataset" or .name == "Object Dataset Full Expansion" or .name == "Object Dataset Pilot")] | sort_by(.databaseId) | reverse | .[0]')

          if [ -z "${CANDIDATE}" ] || [ "${CANDIDATE}" = "null" ]; then
            echo "No successful historical dataset workflow run is available."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          ID=$(printf '%s' "${CANDIDATE}" | jq -r '.databaseId')
          NAME=$(printf '%s' "${CANDIDATE}" | jq -r '.name')
          echo "Selected successful dataset run ${ID}: ${NAME}"
          echo "run_id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "workflow_name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Download dataset artifact
        if: steps.source.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ (steps.source.outputs.workflow_name == 'Object Dataset Full Expansion' || steps.source.outputs.workflow_name == 'Snow Squall Expansion Dataset') && 'object-population-expansion' || 'object-population-pilot' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: dataset_artifact

      - name: Assemble viewer site
        if: steps.source.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Always use the version-controlled viewer shell and locate the prebuilt data bundle dynamically.
          cp viewer/*.html viewer/*.js viewer/*.css _site/

          CATALOG=$(find dataset_artifact -type f -path '*/viewer/data/catalog.json' -print -quit)
          if [ -z "${CATALOG}" ]; then
            CATALOG=$(find dataset_artifact -type f -name catalog.json -print -quit)
          fi

          if [ -n "${CATALOG}" ]; then
            DATA_ROOT="$(dirname "${CATALOG}")"
            mkdir -p _site/data
            cp -R "${DATA_ROOT}/." _site/data/
            echo "Using prebuilt viewer data from: ${DATA_ROOT}"
          else
            echo "ERROR: viewer catalog.json was not present in the dataset artifact."
            find dataset_artifact -maxdepth 6 -type f | sort | sed -n '1,200p'
            exit 1
          fi

          printf 'BTV Snow Squall Historical Object Viewer\nResearch/pilot historical reconstruction only.\nNo production probability forecast is exposed.\n' > _site/README.txt

      - name: Upload static viewer bundle
        if: steps.source.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-historical-viewer-site
          path: _site
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: steps.source.outputs.skip != 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.source.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.source.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
