name: Publish Snow Squall Historical Viewer

on:
  push:
    branches:
      - main
    paths:
      - viewer/*.html
      - viewer/*.js
      - viewer/*.css
      - scripts/build_static_viewer.py
      - .github/workflows/publish-historical-viewer.yml
      - .github/archived-viewer-publish-trigger
  workflow_run:
    workflows:
      - Archived Snow Squall Viewer Smoke Test
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: snow-squall-viewer-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout viewer source
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - name: Resolve successful archived viewer smoke run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CANDIDATE="${TRIGGER_RUN_ID}"
          else
            CANDIDATE=$(gh run list               --workflow "Archived Snow Squall Viewer Smoke Test"               --branch snow-squall-model-foundation               --status success               --limit 1               --json databaseId               --jq '.[0].databaseId')
          fi

          if [ -z "${CANDIDATE}" ] || [ "${CANDIDATE}" = "null" ]; then
            echo "No successful archived-viewer smoke run is available."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Using archived-viewer smoke run ${CANDIDATE}"
          echo "run_id=${CANDIDATE}" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Download validated viewer package
        if: steps.source.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf viewer_artifact
          mkdir -p viewer_artifact
          gh run download "${{ steps.source.outputs.run_id }}"             --name archived-snow-squall-viewer-site             --dir viewer_artifact
          test -f viewer_artifact/index.html
          test -f viewer_artifact/data/catalog.json

      - name: Assemble publication site
        if: steps.source.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # The smoke test has already validated the data package. Keep the
          # version-controlled shell separate from the archived data payload.
          cp viewer/*.html viewer/*.js viewer/*.css _site/
          cp -R viewer_artifact/. _site/

          # Publish the live shell from the current model-foundation viewer source.
          # Do not overwrite it with an older copy from gh-pages; that made the
          # public live page lag behind current live.js/live.html fixes.
          test -f _site/live.html
          test -f _site/live.js
          test -f _site/style.css
          if [ -f viewer/favicon.svg ]; then cp viewer/favicon.svg _site/favicon.svg; fi

          # Preserve the newest modern-validation review page when republishing
          # the historical explorer so either viewer lane can update independently.
          if git fetch origin gh-pages --quiet 2>/dev/null; then
            if git cat-file -e origin/gh-pages:validation.html 2>/dev/null &&                git cat-file -e origin/gh-pages:validation.js 2>/dev/null &&                git cat-file -e origin/gh-pages:data/validation/catalog.json 2>/dev/null; then
              git show origin/gh-pages:validation.html > _site/validation.html
              git show origin/gh-pages:validation.js > _site/validation.js
              mkdir -p _site/data/validation
              git show origin/gh-pages:data/validation/catalog.json > _site/data/validation/catalog.json
            fi
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("_site/data/catalog.json").read_text(encoding="utf-8"))
          assert catalog.get("cases"), "Published viewer catalog is empty"
          assert catalog.get("data_status") in {"research_pilot", "research_replay"}
          assert catalog.get("probability_status") in {"not_scored", "research_replay"}
          print("Publication cases:", len(catalog["cases"]))
          print("Data status:", catalog.get("data_status"))
          print("Probability status:", catalog.get("probability_status"))
          PY

          printf 'BTV Snow Squall Historical Object Viewer\nResearch/pilot historical reconstruction only.\nNo production probability forecast is exposed.\n' > _site/README.txt

      - name: Upload static viewer bundle
        if: steps.source.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-historical-viewer-site
          path: _site
          if-no-files-found: error

      - name: Publish viewer to gh-pages branch
        if: steps.source.outputs.skip != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin --no-tags
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          cp -R _site/. .
          touch .nojekyll
          git add -A
          git commit -m "Publish historical Snow Squall viewer" || exit 0
          git push --force origin gh-pages

          echo "Published viewer branch: https://github.com/${GITHUB_REPOSITORY}/tree/gh-pages"
          echo "When GitHub Pages is enabled from gh-pages, site URL is https://nwsmatthewclay.github.io/BTV-SnowSquall/"

