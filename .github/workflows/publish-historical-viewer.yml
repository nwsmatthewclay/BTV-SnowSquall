name: Publish Snow Squall Historical Viewer

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - viewer/**
      - scripts/build_static_viewer.py
      - .github/workflows/publish-historical-viewer.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: snow-squall-viewer-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout viewer source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Locate latest Object Dataset Pilot run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            RUN=$(gh run list               --workflow "Object Dataset Pilot"               --branch snow-squall-model-foundation               --limit 1               --json databaseId,status,conclusion,headSha               --jq '.[0] // empty')
            if [ -z "${RUN}" ]; then
              echo "No Object Dataset Pilot run found yet."
              sleep 60
              continue
            fi

            ID=$(printf '%s' "${RUN}" | jq -r '.databaseId')
            STATUS=$(printf '%s' "${RUN}" | jq -r '.status')
            CONCLUSION=$(printf '%s' "${RUN}" | jq -r '.conclusion')
            SHA=$(printf '%s' "${RUN}" | jq -r '.headSha')
            echo "Pilot run ${ID}: status=${STATUS} conclusion=${CONCLUSION} sha=${SHA}"

            if [ "${STATUS}" = "completed" ]; then
              if [ "${CONCLUSION}" != "success" ]; then
                echo "Latest pilot run did not succeed."
                exit 1
              fi
              echo "run_id=${ID}" >> "${GITHUB_OUTPUT}"
              echo "head_sha=${SHA}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 60
          done
          echo "Timed out waiting for a completed pilot run."
          exit 1

      - name: Download pilot dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: object-population-pilot
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: pilot_artifact

      - name: Assemble viewer site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp viewer/index.html viewer/app.js viewer/style.css _site/
          python -m py_compile scripts/build_static_viewer.py
          python scripts/build_static_viewer.py             --objects pilot_artifact/data/derived/positive_object_labeled.csv             --cases pilot_artifact/data/manifests/banacos_positive_pilot.csv             --output-dir _site
          printf 'BTV Snow Squall Historical Object Viewer\nResearch/pilot historical reconstruction only.\nNo production probability forecast is exposed.\n' > _site/README.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
