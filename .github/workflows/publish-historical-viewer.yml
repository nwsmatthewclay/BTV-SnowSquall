name: Publish Snow Squall Historical Viewer

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - viewer/*.html
      - viewer/*.js
      - viewer/*.css
      - scripts/build_static_viewer.py
      - .github/workflows/publish-historical-viewer.yml
      - .github/pilot-trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: snow-squall-viewer-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout viewer source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve latest dataset workflow run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(gh api             --header 'Accept: application/vnd.github+json'             --header 'X-GitHub-Api-Version: 2022-11-28'             "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=snow-squall-model-foundation&per_page=100")

          MIN_DATASET_SHA="626048af263afaef735118e653aecc3ae884ff75"
          ACTIVE=""
          SUCCESSFUL=""
          while IFS= read -r RUN; do
            SHA=$(printf '%s' "${RUN}" | jq -r '.head_sha')
            STATUS=$(gh api "/repos/${GITHUB_REPOSITORY}/compare/${MIN_DATASET_SHA}...${SHA}" -q '.status')
            if [ "${STATUS}" != "ahead" ] && [ "${SHA}" != "${MIN_DATASET_SHA}" ]; then
              continue
            fi
            RUN_STATUS=$(printf '%s' "${RUN}" | jq -r '.status')
            RUN_CONCLUSION=$(printf '%s' "${RUN}" | jq -r '.conclusion')
            if [ "${RUN_STATUS}" != "completed" ]; then
              ACTIVE="${RUN}"
              break
            fi
            if [ "${RUN_CONCLUSION}" = "success" ]; then
              SUCCESSFUL="${RUN}"
              break
            fi
          done < <(printf '%s' "${JSON}" | jq -c '
            [.workflow_runs[]
             | select(.name == "Object Dataset Pilot" or .name == "Object Dataset Full Expansion")]
            | sort_by(.id)
            | reverse
            | .[]')

          CANDIDATE="${ACTIVE:-${SUCCESSFUL}}"
          [ -n "${CANDIDATE}" ] || { echo "No active or successful repaired-lineage dataset run found."; exit 1; }

          if [ -z "${CANDIDATE}" ]; then
            echo "No successful dataset workflow from repaired lineage was found."
            exit 1
          fi

          ID=$(printf '%s' "${CANDIDATE}" | jq -r '.id')
          NAME=$(printf '%s' "${CANDIDATE}" | jq -r '.name')
          STATUS=$(printf '%s' "${CANDIDATE}" | jq -r '.status')
          CONCLUSION=$(printf '%s' "${CANDIDATE}" | jq -r '.conclusion')
          SHA=$(printf '%s' "${CANDIDATE}" | jq -r '.head_sha')

          echo "Selected dataset run ${ID}: ${NAME}, status=${STATUS}, conclusion=${CONCLUSION}, sha=${SHA}"
          echo "run_id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "workflow_name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "status=${STATUS}" >> "${GITHUB_OUTPUT}"

          if [ "${STATUS}" != "completed" ]; then
            echo "wait=true" >> "${GITHUB_OUTPUT}"
          elif [ "${CONCLUSION}" = "success" ]; then
            echo "wait=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Latest dataset run failed: ${CONCLUSION}"
            exit 1
          fi

      - name: Wait for active dataset run
        if: steps.source.outputs.wait == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_NAME: ${{ steps.source.outputs.workflow_name }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            RUN=$(gh api               --header 'Accept: application/vnd.github+json'               --header 'X-GitHub-Api-Version: 2022-11-28'               "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
            STATUS=$(printf '%s' "${RUN}" | jq -r '.status')
            CONCLUSION=$(printf '%s' "${RUN}" | jq -r '.conclusion')
            echo "${SOURCE_NAME} run ${SOURCE_RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"
            if [ "${STATUS}" = "completed" ]; then
              [ "${CONCLUSION}" = "success" ] || exit 1
              exit 0
            fi
            sleep 60
          done
          echo "Timed out waiting for dataset run."
          exit 1

      - name: Download dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.workflow_name == 'Object Dataset Full Expansion' && 'object-population-expansion' || 'object-population-pilot' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: dataset_artifact

      - name: Assemble viewer site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Always use the version-controlled viewer shell and locate the prebuilt data bundle dynamically.
          cp viewer/*.html viewer/*.js viewer/*.css _site/

          CATALOG=$(find dataset_artifact -type f -path '*/viewer/data/catalog.json' -print -quit)
          if [ -z "${CATALOG}" ]; then
            CATALOG=$(find dataset_artifact -type f -name catalog.json -print -quit)
          fi

          if [ -n "${CATALOG}" ]; then
            DATA_ROOT="$(dirname "${CATALOG}")"
            mkdir -p _site/data
            cp -R "${DATA_ROOT}/." _site/data/
            echo "Using prebuilt viewer data from: ${DATA_ROOT}"
          else
            echo "ERROR: viewer catalog.json was not present in the dataset artifact."
            find dataset_artifact -maxdepth 6 -type f | sort | sed -n '1,200p'
            exit 1
          fi

          printf 'BTV Snow Squall Historical Object Viewer\nResearch/pilot historical reconstruction only.\nNo production probability forecast is exposed.\n' > _site/README.txt

      - name: Upload static viewer bundle
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-historical-viewer-site
          path: _site
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
