name: Publish Snow Squall Historical Viewer

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - viewer/**
      - scripts/build_static_viewer.py
      - .github/workflows/publish-historical-viewer.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: snow-squall-viewer-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout viewer source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Locate latest dataset run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BEST_ID=""
          BEST_NAME=""
          BEST_STATUS=""
          BEST_CONCLUSION=""
          BEST_SHA=""

          for NAME in "Object Dataset Pilot" "Object Dataset Full Expansion"; do
            RUN=$(gh run list               --workflow "${NAME}"               --branch snow-squall-model-foundation               --limit 1               --json databaseId,status,conclusion,headSha               --jq '.[0] // empty')
            if [ -z "${RUN}" ]; then
              continue
            fi

            ID=$(printf '%s' "${RUN}" | jq -r '.databaseId')
            if [ -z "${BEST_ID}" ] || [ "${ID}" -gt "${BEST_ID}" ]; then
              BEST_ID="${ID}"
              BEST_NAME="${NAME}"
              BEST_STATUS=$(printf '%s' "${RUN}" | jq -r '.status')
              BEST_CONCLUSION=$(printf '%s' "${RUN}" | jq -r '.conclusion')
              BEST_SHA=$(printf '%s' "${RUN}" | jq -r '.headSha')
            fi
          done

          if [ -z "${BEST_ID}" ]; then
            echo "No dataset workflow runs found."
            sleep 60
            exit 1
          fi

          echo "Latest dataset run: ${BEST_ID} (${BEST_NAME}) status=${BEST_STATUS} conclusion=${BEST_CONCLUSION} sha=${BEST_SHA}"

          if [ "${BEST_STATUS}" != "completed" ]; then
            echo "run_id=${BEST_ID}" >> "${GITHUB_OUTPUT}"
            echo "workflow_name=${BEST_NAME}" >> "${GITHUB_OUTPUT}"
            echo "waiting=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${BEST_CONCLUSION}" != "success" ]; then
            echo "Latest dataset workflow did not succeed."
            exit 1
          fi

          echo "run_id=${BEST_ID}" >> "${GITHUB_OUTPUT}"
          echo "workflow_name=${BEST_NAME}" >> "${GITHUB_OUTPUT}"
          echo "waiting=false" >> "${GITHUB_OUTPUT}"

      - name: Wait for active dataset run
        if: steps.source.outputs.waiting == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_WORKFLOW: ${{ steps.source.outputs.workflow_name }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            RUN=$(gh run view "${SOURCE_RUN_ID}" --json status,conclusion,headSha)
            STATUS=$(printf '%s' "${RUN}" | jq -r '.status')
            CONCLUSION=$(printf '%s' "${RUN}" | jq -r '.conclusion')
            echo "${SOURCE_WORKFLOW} run ${SOURCE_RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"
            if [ "${STATUS}" = "completed" ]; then
              if [ "${CONCLUSION}" != "success" ]; then
                echo "Dataset run failed."
                exit 1
              fi
              exit 0
            fi
            sleep 60
          done
          echo "Timed out waiting for dataset run."
          exit 1

      - name: Download dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.workflow_name == 'Object Dataset Full Expansion' && 'object-population-expansion' || 'object-population-pilot' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: dataset_artifact

      - name: Assemble viewer site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp viewer/index.html viewer/app.js viewer/style.css _site/
          python -m py_compile scripts/build_static_viewer.py

          if [ "${{ steps.source.outputs.workflow_name }}" = "Object Dataset Full Expansion" ]; then
            CASES="dataset_artifact/data/manifests/banacos_2014_cases.csv"
          else
            CASES="dataset_artifact/data/manifests/banacos_positive_pilot.csv"
          fi

          python scripts/build_static_viewer.py             --objects dataset_artifact/data/derived/positive_object_labeled.csv             --cases "${CASES}"             --output-dir _site

          printf 'BTV Snow Squall Historical Object Viewer\nResearch/pilot historical reconstruction only.\nNo production probability forecast is exposed.\n' > _site/README.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
