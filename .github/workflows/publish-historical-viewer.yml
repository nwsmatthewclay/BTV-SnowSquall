name: Publish Snow Squall Historical Viewer

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - viewer/**
      - scripts/build_static_viewer.py
      - .github/workflows/publish-historical-viewer.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: snow-squall-viewer-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout viewer source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve latest dataset workflow run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(gh api             --header 'Accept: application/vnd.github+json'             --header 'X-GitHub-Api-Version: 2022-11-28'             "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=snow-squall-model-foundation&per_page=100")

          CANDIDATE=$(printf '%s' "${JSON}" | jq -c '
            [.workflow_runs[]
             | select(.name == "Object Dataset Pilot" or .name == "Object Dataset Full Expansion")]
            | sort_by(.id)
            | reverse
            | .[0] // empty')

          if [ -z "${CANDIDATE}" ]; then
            echo "No dataset workflow runs found."
            exit 1
          fi

          ID=$(printf '%s' "${CANDIDATE}" | jq -r '.id')
          NAME=$(printf '%s' "${CANDIDATE}" | jq -r '.name')
          STATUS=$(printf '%s' "${CANDIDATE}" | jq -r '.status')
          CONCLUSION=$(printf '%s' "${CANDIDATE}" | jq -r '.conclusion')
          SHA=$(printf '%s' "${CANDIDATE}" | jq -r '.head_sha')

          echo "Selected dataset run ${ID}: ${NAME}, status=${STATUS}, conclusion=${CONCLUSION}, sha=${SHA}"
          echo "run_id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "workflow_name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "status=${STATUS}" >> "${GITHUB_OUTPUT}"

          if [ "${STATUS}" != "completed" ]; then
            echo "wait=true" >> "${GITHUB_OUTPUT}"
          elif [ "${CONCLUSION}" = "success" ]; then
            echo "wait=false" >> "${GITHUB_OUTPUT}"
          else
            echo "Latest dataset run failed: ${CONCLUSION}"
            exit 1
          fi

      - name: Wait for active dataset run
        if: steps.source.outputs.wait == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_NAME: ${{ steps.source.outputs.workflow_name }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            RUN=$(gh api               --header 'Accept: application/vnd.github+json'               --header 'X-GitHub-Api-Version: 2022-11-28'               "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
            STATUS=$(printf '%s' "${RUN}" | jq -r '.status')
            CONCLUSION=$(printf '%s' "${RUN}" | jq -r '.conclusion')
            echo "${SOURCE_NAME} run ${SOURCE_RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"
            if [ "${STATUS}" = "completed" ]; then
              [ "${CONCLUSION}" = "success" ] || exit 1
              exit 0
            fi
            sleep 60
          done
          echo "Timed out waiting for dataset run."
          exit 1

      - name: Download dataset artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.workflow_name == 'Object Dataset Full Expansion' && 'object-population-expansion' || 'object-population-pilot' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: dataset_artifact

      - name: Assemble viewer site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp viewer/index.html viewer/app.js viewer/style.css _site/
          python -m py_compile scripts/build_static_viewer.py

          if [ "${{ steps.source.outputs.workflow_name }}" = "Object Dataset Full Expansion" ]; then
            CASES="dataset_artifact/data/manifests/banacos_2014_cases.csv"
          else
            CASES="dataset_artifact/data/manifests/banacos_positive_pilot.csv"
          fi

          python scripts/build_static_viewer.py             --objects dataset_artifact/data/derived/positive_object_labeled.csv             --cases "${CASES}"             --output-dir _site

          printf 'BTV Snow Squall Historical Object Viewer\nResearch/pilot historical reconstruction only.\nNo production probability forecast is exposed.\n' > _site/README.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
