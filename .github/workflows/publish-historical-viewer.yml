name: Publish Snow Squall Historical Viewer

on:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - viewer/*.html
      - viewer/*.js
      - viewer/*.css
      - scripts/build_static_viewer.py
      - .github/workflows/publish-historical-viewer.yml
      - .github/pilot-trigger
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: snow-squall-viewer-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout viewer source
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - name: Resolve latest dataset workflow run
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          JSON=$(gh api \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=snow-squall-model-foundation&per_page=100")

          MIN_DATASET_SHA="626048af263afaef735118e653aecc3ae884ff75"
          ACTIVE=""
          USABLE=""

          while IFS= read -r RUN; do
            SHA=$(printf '%s' "${RUN}" | jq -r '.head_sha')
            STATUS=$(gh api "/repos/${GITHUB_REPOSITORY}/compare/${MIN_DATASET_SHA}...${SHA}" -q '.status')
            if [ "${STATUS}" != "ahead" ] && [ "${SHA}" != "${MIN_DATASET_SHA}" ]; then
              continue
            fi

            RUN_STATUS=$(printf '%s' "${RUN}" | jq -r '.status')
            RUN_CONCLUSION=$(printf '%s' "${RUN}" | jq -r '.conclusion')
            RUN_ID=$(printf '%s' "${RUN}" | jq -r '.id')
            RUN_NAME=$(printf '%s' "${RUN}" | jq -r '.name')

            if [ "${RUN_STATUS}" != "completed" ]; then
              ACTIVE="${RUN}"
              break
            fi

            if [ "${RUN_CONCLUSION}" = "success" ]; then
              USABLE="${RUN}"
              break
            fi

            # A failed pilot may still be usable for the research viewer/replay
            # when every dataset science step completed and only the known test
            # gate failed. Never treat that run as an operational release.
            JOBS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100")
            DATASET_JOB=$(printf '%s' "${JOBS}" | jq -c '.jobs[] | select(.name == "dataset-pilot")' | head -n 1)
            if [ -n "${DATASET_JOB}" ] && [ "$(printf '%s' "${DATASET_JOB}" | jq -r '.conclusion')" = "failure" ]; then
              STEP42=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Train case-held-out baseline models") | .conclusion')
              STEP43=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Summarize baseline horizon verification") | .conclusion')
              STEP45=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Build event-level verification diagnostics") | .conclusion')
              STEP46=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Audit training dataset") | .conclusion')
              STEP47=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Render positive radar frames for viewer") | .conclusion')
              STEP48=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Build historical viewer data package") | .conclusion')
              STEP50=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Build SOO-ready pilot report") | .conclusion')
              STEP51=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Run tests") | .conclusion')
              STEP53=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Upload object dataset pilot") | .conclusion')
              if [ "${STEP42}" = "success" ] && [ "${STEP43}" = "success" ] && [ "${STEP45}" = "success" ] && [ "${STEP46}" = "success" ] && [ "${STEP47}" = "success" ] && [ "${STEP48}" = "success" ] && [ "${STEP50}" = "success" ] && [ "${STEP51}" = "failure" ] && [ "${STEP53}" = "success" ]; then
                USABLE="${RUN}"
                echo "Using research-package-only failed run ${RUN_ID}: all science/package gates passed; only Run tests failed."
                break
              fi
            fi
          done < <(printf '%s' "${JSON}" | jq -c '
            [.workflow_runs[]
             | select(.name == "Object Dataset Pilot" or .name == "Object Dataset Full Expansion")]
            | sort_by(.id)
            | reverse
            | .[]')

          CANDIDATE="${ACTIVE:-${USABLE}}"
          if [ -z "${CANDIDATE}" ]; then
            echo "No active or usable repaired-lineage dataset run found; nothing to publish."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          ID=$(printf '%s' "${CANDIDATE}" | jq -r '.id')
          NAME=$(printf '%s' "${CANDIDATE}" | jq -r '.name')
          STATUS=$(printf '%s' "${CANDIDATE}" | jq -r '.status')
          CONCLUSION=$(printf '%s' "${CANDIDATE}" | jq -r '.conclusion')
          SHA=$(printf '%s' "${CANDIDATE}" | jq -r '.head_sha')

          echo "Selected dataset run ${ID}: ${NAME}, status=${STATUS}, conclusion=${CONCLUSION}, sha=${SHA}"
          echo "run_id=${ID}" >> "${GITHUB_OUTPUT}"
          echo "workflow_name=${NAME}" >> "${GITHUB_OUTPUT}"
          echo "status=${STATUS}" >> "${GITHUB_OUTPUT}"

          if [ "${STATUS}" != "completed" ]; then
            echo "wait=true" >> "${GITHUB_OUTPUT}"
          else
            echo "wait=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Wait for active dataset run
        if: steps.source.outputs.skip != 'true' && steps.source.outputs.wait == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          SOURCE_NAME: ${{ steps.source.outputs.workflow_name }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            RUN=$(gh api \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")
            STATUS=$(printf '%s' "${RUN}" | jq -r '.status')
            CONCLUSION=$(printf '%s' "${RUN}" | jq -r '.conclusion')
            echo "${SOURCE_NAME} run ${SOURCE_RUN_ID}: status=${STATUS} conclusion=${CONCLUSION}"
            if [ "${STATUS}" = "completed" ]; then
              if [ "${CONCLUSION}" = "success" ]; then
                exit 0
              fi

              JOBS=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?per_page=100")
              DATASET_JOB=$(printf '%s' "${JOBS}" | jq -c '.jobs[] | select(.name == "dataset-pilot")' | head -n 1)
              [ -n "${DATASET_JOB}" ] || exit 1
              JOB_CONCLUSION=$(printf '%s' "${DATASET_JOB}" | jq -r '.conclusion')

              STEP42=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Train case-held-out baseline models") | .conclusion')
              STEP43=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Summarize baseline horizon verification") | .conclusion')
              STEP46=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Audit training dataset") | .conclusion')
              STEP47=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Render positive radar frames for viewer") | .conclusion')
              STEP48=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Build historical viewer data package") | .conclusion')
              STEP50=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Build SOO-ready pilot report") | .conclusion')
              STEP51=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Run tests") | .conclusion')
              STEP53=$(printf '%s' "${DATASET_JOB}" | jq -r '.steps[] | select(.name=="Upload object dataset pilot") | .conclusion')

              if [ "${JOB_CONCLUSION}" = "failure" ] && [ "${STEP42}" = "success" ] && [ "${STEP43}" = "success" ] && [ "${STEP46}" = "success" ] && [ "${STEP47}" = "success" ] && [ "${STEP48}" = "success" ] && [ "${STEP50}" = "success" ] && [ "${STEP51}" = "failure" ] && [ "${STEP53}" = "success" ]; then
                echo "Dataset science/package completed; test-only failure is being treated as research-package usable."
                exit 0
              fi
              exit 1
            fi
            sleep 60
          done
          echo "Timed out waiting for dataset run."
          exit 1

      - name: Download dataset artifact
        if: steps.source.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.source.outputs.workflow_name == 'Object Dataset Full Expansion' && 'object-population-expansion' || 'object-population-pilot' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          path: dataset_artifact

      - name: Assemble viewer site
        if: steps.source.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # Always use the version-controlled viewer shell and locate the prebuilt data bundle dynamically.
          cp viewer/*.html viewer/*.js viewer/*.css _site/

          CATALOG=$(find dataset_artifact -type f -path '*/viewer/data/catalog.json' -print -quit)
          if [ -z "${CATALOG}" ]; then
            CATALOG=$(find dataset_artifact -type f -name catalog.json -print -quit)
          fi

          if [ -n "${CATALOG}" ]; then
            DATA_ROOT="$(dirname "${CATALOG}")"
            mkdir -p _site/data
            cp -R "${DATA_ROOT}/." _site/data/
            echo "Using prebuilt viewer data from: ${DATA_ROOT}"
          else
            echo "ERROR: viewer catalog.json was not present in the dataset artifact."
            find dataset_artifact -maxdepth 6 -type f | sort | sed -n '1,200p'
            exit 1
          fi

          printf 'BTV Snow Squall Historical Object Viewer\nResearch/pilot historical reconstruction only.\nNo production probability forecast is exposed.\n' > _site/README.txt

      - name: Upload static viewer bundle
        if: steps.source.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-historical-viewer-site
          path: _site
          if-no-files-found: error

      - name: Configure GitHub Pages
        if: steps.source.outputs.skip != 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.source.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.source.outputs.skip != 'true'
        id: deployment
        uses: actions/deploy-pages@v4
