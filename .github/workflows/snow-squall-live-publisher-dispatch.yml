name: Snow Squall Live Publisher Dispatch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/snow-squall-live-publisher-dispatch.yml"
      - ".github/workflows/snow-squall-live-publisher.yml"
      - "acquisition/radar_watcher.py"
  # Kick tracking after a fresh standalone radar frame is published. The guard
  # below still prevents overlapping object cycles, while this event-driven
  # trigger avoids depending solely on delayed GitHub cron scheduling.
  workflow_run:
    workflows:
      - "Snow Squall Radar Frame Publisher"
    types:
      - completed
  schedule:
    - cron: "3-58/5 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: snow-squall-live-publisher-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Avoid queuing duplicate live processing cycles
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The dispatcher runs every five minutes, but Level-II decoding,
          # gridding, RAP retrieval, and object scoring can take longer. Without
          # this guard, each tick queues another 30-minute publisher run behind
          # the active one, amplifying stale-feed delays.
          # Ignore abandoned queued runs. GitHub can leave a workflow_dispatch
          # run queued indefinitely (for example after runner/capacity issues).
          # Counting every queued run here permanently blocks all future cycles.
          # A real in-progress run is still respected; queued runs count only
          # while they are recent enough to be a legitimate pending dispatch.
          count_recent_active_runs() {
            local workflow="$1"
            local branch="$2"
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow "$workflow" \
              --branch "$branch" \
              --limit 100 \
              --json status,createdAt | python -c '
          import json, sys
          from datetime import datetime, timezone
          runs = json.load(sys.stdin)
          now = datetime.now(timezone.utc)
          count = 0
          for run in runs:
              status = run.get("status")
              if status == "in_progress":
                  count += 1
                  continue
              if status != "queued":
                  continue
              raw = run.get("createdAt")
              try:
                  created = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  age_minutes = (now - created.astimezone(timezone.utc)).total_seconds() / 60
              except (AttributeError, TypeError, ValueError):
                  continue
              if 0 <= age_minutes <= 35:
                  count += 1
          print(count)
          '
          }

          active_publisher="$(count_recent_active_runs "Snow Squall Live Object Publisher" main)"
          active_event_cycle="$(count_recent_active_runs "Snow Squall Event-Driven Live Cycle" main)"
          active_foundation_publisher="$(count_recent_active_runs "Publish Live Snow Squall Objects" snow-squall-model-foundation)"

          echo "Active/queued main publisher runs: $active_publisher"
          echo "Active/queued event cycles: $active_event_cycle"
          echo "Active/queued model-foundation publisher runs: $active_foundation_publisher"

          if [ "$active_publisher" -gt 0 ] || [ "$active_event_cycle" -gt 0 ] || [ "$active_foundation_publisher" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A live processing cycle is already queued or running; skipping duplicate dispatch."
            exit 0
          fi

      - name: Dispatch canonical foundation publisher
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # The dispatchable workflow is defined on main. It checks out and
          # executes the canonical processing code from snow-squall-model-foundation.
          # Keep this as the only scheduled dispatcher; do not add a second
          # scheduled publisher.
          echo "Dispatching Snow Squall Live Object Publisher on main (processor code: snow-squall-model-foundation)"
          gh workflow run "Snow Squall Live Object Publisher" \
            --repo "${{ github.repository }}" \
            --ref main
          echo "Canonical live publisher dispatched."
