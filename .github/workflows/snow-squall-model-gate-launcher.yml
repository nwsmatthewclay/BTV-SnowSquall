name: Snow Squall Model Gate Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snow-squall-model-gate-launcher.yml
      - .github/model-gate-trigger

permissions:
  actions: write
  contents: read

jobs:
  dispatch-model-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch case-held-out model gate
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run case-heldout-model-gate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref snow-squall-model-foundation
          echo "Dispatched case-held-out model gate on snow-squall-model-foundation"
