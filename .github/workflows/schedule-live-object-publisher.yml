name: Schedule Snow Squall Live Publisher

# GitHub scheduled workflows only run from the repository's default branch.
# The full science publisher intentionally lives on snow-squall-model-foundation,
# so this small default-branch dispatcher starts that workflow on its own ref.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: snow-squall-live-publisher-dispatch
  cancel-in-progress: false

jobs:
  dispatch-publisher:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch science publisher on foundation branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run live-object-publisher.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref snow-squall-model-foundation
          echo "Dispatched live-object-publisher.yml on snow-squall-model-foundation."
