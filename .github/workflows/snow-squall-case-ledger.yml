name: Snow Squall Unified Case Ledger

on:
  workflow_run:
    workflows:
      - Snow Squall Case Discovery
      - Snow Squall IEM LSR Harvest
      - Snow Squall NWS Text Review
    types:
      - completed
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/ledger-trigger
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: snow-squall-case-ledger
  cancel-in-progress: true

jobs:
  merge:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Locate latest successful source harvests
        id: sources
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          discovery_run="$(gh run list --workflow "Snow Squall Case Discovery" --branch snow-squall-model-foundation --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          lsr_run="$(gh run list --workflow "Snow Squall IEM LSR Harvest" --branch snow-squall-model-foundation --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$discovery_run" ] || [ "$discovery_run" = "null" ] || [ -z "$lsr_run" ] || [ "$lsr_run" = "null" ]; then
            echo "Required source harvests are not ready yet; this ledger pass will exit cleanly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          nws_text_run="$(gh run list --workflow "Snow Squall NWS Text Review" --branch snow-squall-model-foundation --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$nws_text_run" ] || [ "$nws_text_run" = "null" ]; then
            echo "BTV NWS text review is not ready yet; this ledger pass will exit cleanly."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "nws_text_run=$nws_text_run" >> "$GITHUB_OUTPUT"
          echo "discovery_run=$discovery_run" >> "$GITHUB_OUTPUT"
          echo "lsr_run=$lsr_run" >> "$GITHUB_OUTPUT"

      - name: Download discovery source artifact
        if: steps.sources.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ steps.sources.outputs.discovery_run }}" --name snow-squall-case-discovery --dir discovery_artifact

      - name: Download corrected IEM LSR artifact
        if: steps.sources.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ steps.sources.outputs.lsr_run }}" --name snow-squall-iem-lsr-review --dir lsr_artifact

      - name: Download BTV NWS text review artifact
        if: steps.sources.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ steps.sources.outputs.nws_text_run }}" --name snow-squall-nws-text-review --dir nws_text_artifact

      - name: Build unified case ledger
        if: steps.sources.outputs.skip != 'true'
        run: |
          python scripts/merge_snow_squall_case_sources.py \
            --discovery discovery_artifact/snow_squall_candidates.csv \
            --iem-lsr lsr_artifact/iem_lsr_case_clusters.csv \
            --nws-text nws_text_artifact/iem_nws_text_candidates.csv \
            --output-dir data/discovery/unified

      - name: Audit unified ledger
        if: steps.sources.outputs.skip != 'true'
        run: |
          python scripts/audit_snow_squall_case_ledger.py \
            --cases data/discovery/unified/snow_squall_case_ledger.csv \
            --radar data/discovery/unified/snow_squall_case_radar_manifest.csv \
            --start-year 1950 \
            --end-year 2026 \
            --output data/discovery/unified/snow_squall_case_ledger_audit.json

      - name: Upload unified case ledger
        if: steps.sources.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-unified-case-ledger
          path: data/discovery/unified
          if-no-files-found: error
