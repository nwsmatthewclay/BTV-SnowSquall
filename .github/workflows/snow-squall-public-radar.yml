name: Snow Squall Public Radar Archive Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snow-squall-live-object-publisher-v2
  cancel-in-progress: false

jobs:
  public-radar-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation
          fetch-depth: 1

      - name: Restore live-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch snow-squall-live-data \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" live-data
          mkdir -p viewer/data/live
          if [ -d live-data/viewer/data/live ]; then
            cp -a live-data/viewer/data/live/. viewer/data/live/
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-science.txt

      - name: Install radar processing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-science.txt

      - name: Check public KCXX archive for a new scan
        id: archive
        run: |
          echo "new_scan=false" >> "$GITHUB_OUTPUT"
          python scripts/public_archive_trigger.py

      - name: Process synchronized KCXX/KTYX cycle
        if: steps.archive.outputs.new_scan == 'true'
        run: |
          python scripts/process_live_event.py \
            --scan-time "${{ steps.archive.outputs.scan_time }}" \
            --kcxx-tolerance-minutes 4 \
            --ktyx-max-age-minutes 8 \
            --archive-attempts 6 \
            --archive-delay-seconds 20

      - name: Validate synchronized publication
        if: steps.archive.outputs.new_scan == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          live = Path("viewer/data/live")
          event = json.loads((live / "event_cycle.json").read_text())
          mosaic = json.loads((live / "radar_mosaic.json").read_text())

          kcxx_event = event["kcxx"]
          kcxx_sources = [s for s in mosaic.get("sources", []) if s.get("radar") == "KCXX"]
          if not kcxx_sources:
              raise SystemExit("Mosaic has no KCXX source")
          if kcxx_sources[0]["source_file"] != Path(kcxx_event["source_file"]).name:
              raise SystemExit("Mosaic KCXX source does not match event-cycle KCXX source")

          ktyx_event = event.get("ktyx")
          ktyx_sources = [s for s in mosaic.get("sources", []) if s.get("radar") == "KTYX"]
          if ktyx_event:
              if not ktyx_sources:
                  raise SystemExit("Event cycle has KTYX but mosaic does not")
              if ktyx_sources[0]["source_file"] != Path(ktyx_event["source_file"]).name:
                  raise SystemExit("Mosaic KTYX source does not match event-cycle KTYX source")
              if ktyx_event["scan_time_utc"] > kcxx_event["scan_time_utc"]:
                  raise SystemExit("KTYX is newer than KCXX")

          print("Synchronized cycle validation passed.")
          print(json.dumps(event, indent=2))

          # The object feeds must describe the exact same radar volumes as the
          # mosaic. This prevents the historical failure mode where fresh
          # objects were published alongside an older radar image.
          for site in ("KCXX", "KTYX"):
              geo = live / f"{site}_objects.geojson"
              if not geo.exists():
                  raise SystemExit(f"Missing {site} object feed")
              payload = json.loads(geo.read_text())
              features = payload.get("features") or []
              expected = event.get(site.lower())
              if expected is None:
                  continue
              expected_time = expected["scan_time_utc"]
              expected_source = Path(expected["source_file"]).name
              meta = payload.get("metadata") or {}
              if meta.get("scan_time_utc") != expected_time:
                  raise SystemExit(f"{site} object metadata timestamp does not match event cycle")
              if Path(str(meta.get("source_file", ""))).name != expected_source:
                  raise SystemExit(f"{site} object source does not match event cycle")
              bad = [f for f in features if f.get("properties", {}).get("timestamp") != expected_time]
              if bad:
                  raise SystemExit(f"{site} contains objects from a different scan")
              print(f"{site}: {len(features)} objects synchronized to {expected_source}")

      - name: Publish synchronized live feed
        if: steps.archive.outputs.new_scan == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf live-data/viewer/data/live
          mkdir -p live-data/viewer/data
          cp -a viewer/data/live live-data/viewer/data/live

          cd live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/data/live
          if git diff --cached --quiet; then
            echo "No live-data changes to publish."
            exit 0
          fi
          git commit -m "Publish synchronized public NEXRAD cycle"
          git push origin snow-squall-live-data

      - name: Report no-new-scan condition
        if: steps.archive.outputs.new_scan != 'true'
        run: echo "Public KCXX archive has no scan newer than the published live cycle."
