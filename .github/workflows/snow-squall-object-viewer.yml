name: Snow Squall Object Viewer Build

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: "Banacos case ID"
        required: true
        default: "BTV20060224"
      radar_site:
        description: "Radar site"
        required: true
        default: "KCXX"

jobs:
  build-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CASE_ID: ${{ inputs.case_id || 'BTV20060224' }}
      RADAR_SITE: ${{ inputs.radar_site || 'KCXX' }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-science.txt

      - name: Download historical Level-II
        run: |
          python acquisition/historical_level2.py \
            --manifest data/manifests/banacos_radar_windows.csv \
            --output data/raw/level2 \
            --case-id "$CASE_ID"

      - name: Verify requested radar
        run: |
          test -d "data/raw/level2/$RADAR_SITE"
          find "data/raw/level2/$RADAR_SITE" -type f | wc -l

      - name: Restrict to requested radar
        run: |
          rm -rf data/raw/level2_filtered
          mkdir -p data/raw/level2_filtered
          cp -R "data/raw/level2/$RADAR_SITE" data/raw/level2_filtered/

      - name: Reconstruct geographic objects
        run: |
          mkdir -p data/derived
          python scripts/reconstruct_pilot.py \
            --input data/raw/level2_filtered \
            --output "data/derived/${CASE_ID}_${RADAR_SITE}_object_scans.csv"

      - name: Export viewer object history
        run: |
          python scripts/export_viewer_data.py \
            "data/derived/${CASE_ID}_${RADAR_SITE}_object_scans.csv" \
            --output-dir data/derived/viewer \
            --case-id "$CASE_ID" \
            --radar-site "$RADAR_SITE"

      - name: Render radar frames
        run: |
          python scripts/export_radar_frames.py \
            --input data/raw/level2_filtered \
            --output-dir data/derived/viewer

      - name: Build viewer bundle
        run: |
          mkdir -p data/derived/viewer_bundle/data/frames
          cp -R viewer/. data/derived/viewer_bundle/
          cp data/derived/viewer/objects.geojson data/derived/viewer_bundle/data/
          cp data/derived/viewer/manifest.json data/derived/viewer_bundle/data/
          cp data/derived/viewer/frames.json data/derived/viewer_bundle/data/
          cp -R data/derived/viewer/frames/. data/derived/viewer_bundle/data/frames/

      - name: Upload viewer bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "${{ env.CASE_ID }}-${{ env.RADAR_SITE }}-object-viewer"
          path: |
            data/derived/viewer_bundle/**
            data/derived/*_object_scans.csv
          if-no-files-found: warn
