name: Snow Squall Live Object Publisher

on:
  push:
    paths:
      - ".github/workflows/snow-squall-live-publisher.yml"
      - "scripts/live_object_worker.py"
      - "scripts/process_live_volume.py"
      - "scripts/append_live_object_history.py"
      - "scripts/audit_operational_readiness.py"
      - "scripts/live_healthcheck.py"
      - "scripts/build_live_radar_mosaic.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snow-squall-live-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation
          fetch-depth: 2

      - name: Restore prior live feed history
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin snow-squall-live-data >/dev/null 2>&1; then
            git fetch --no-tags origin snow-squall-live-data
            git checkout origin/snow-squall-live-data -- viewer/data/live || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Prepare persistent live-data directories
        run: |
          mkdir -p viewer/data/live data/derived

      - name: Process latest KCXX volume
        run: |
          python scripts/live_object_worker.py             --radar KCXX             --poll-seconds 2             --max-polls 1             --state viewer/data/live/KCXX_state.json             --output viewer/data/live/KCXX_objects.geojson             --history-jsonl viewer/data/live/KCXX_history.jsonl             --history-csv data/derived/KCXX_history.csv

      - name: Process latest KTYX volume
        run: |
          python scripts/live_object_worker.py             --radar KTYX             --poll-seconds 2             --max-polls 1             --state viewer/data/live/KTYX_state.json             --output viewer/data/live/KTYX_objects.geojson             --history-jsonl viewer/data/live/KTYX_history.jsonl             --history-csv data/derived/KTYX_history.csv

      - name: Normalize persisted live timestamps
        run: |
          python scripts/normalize_live_products.py --root viewer/data/live

      - name: Build KCXX KTYX live radar mosaic
        run: |
          python scripts/build_live_radar_mosaic.py             --raw-root data/raw             --kcxx-state viewer/data/live/KCXX_state.json             --ktyx-state viewer/data/live/KTYX_state.json             --output-image viewer/data/live/radar_mosaic.png             --output-json viewer/data/live/radar_mosaic.json

      - name: Build bounded browser history payloads
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          cutoff = datetime.now(timezone.utc) - timedelta(days=7)
          max_rows = 15000

          for site in ("KCXX", "KTYX"):
              src = Path(f"viewer/data/live/{site}_history.jsonl")
              rows = []
              if src.exists():
                  for line in src.read_text(encoding="utf-8").splitlines():
                      try:
                          row = json.loads(line)
                          ts = datetime.fromisoformat(
                              str(row["timestamp"]).replace("Z", "+00:00")
                          ).astimezone(timezone.utc)
                          if ts >= cutoff:
                              rows.append(row)
                      except (KeyError, TypeError, ValueError, json.JSONDecodeError):
                          continue

              rows.sort(key=lambda r: r.get("timestamp", ""))
              rows = rows[-max_rows:]

              src.write_text(
                  "\n".join(
                      json.dumps(row, separators=(",", ":"))
                      for row in rows
                  ) + ("\n" if rows else ""),
                  encoding="utf-8",
              )
              Path(f"viewer/data/live/{site}_history.json").write_text(
                  json.dumps(rows, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              print(site, "history rows:", len(rows))
          PY

      - name: Validate KCXX live product
        run: |
          python scripts/audit_operational_readiness.py             --state viewer/data/live/KCXX_state.json             --geojson viewer/data/live/KCXX_objects.geojson             --max-age-minutes 30
          python scripts/live_healthcheck.py             --state viewer/data/live/KCXX_state.json             --geojson viewer/data/live/KCXX_objects.geojson             --max-age-minutes 15 > viewer/data/live/KCXX_health.json

      - name: Validate KTYX live product
        run: |
          python scripts/audit_operational_readiness.py             --state viewer/data/live/KTYX_state.json             --geojson viewer/data/live/KTYX_objects.geojson             --max-age-minutes 30
          python scripts/live_healthcheck.py             --state viewer/data/live/KTYX_state.json             --geojson viewer/data/live/KTYX_objects.geojson             --max-age-minutes 15 > viewer/data/live/KTYX_health.json

      - name: Publish isolated live-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/snow-squall-live-payload
          cp -R viewer/data/live/. /tmp/snow-squall-live-payload/

          git checkout --orphan snow-squall-live-data
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p viewer/data/live
          cp -R /tmp/snow-squall-live-payload/. viewer/data/live/
          git add viewer/data/live

          if git diff --cached --quiet; then
            echo "No live data changes; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update live snow squall object feeds"
          git push --force origin HEAD:snow-squall-live-data

# Live publisher follows the model-foundation branch.
# Live refresh heartbeat: 2026-10-03T21:50 EDT — base Z + base Vr products
