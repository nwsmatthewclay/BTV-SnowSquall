name: Snow Squall Live Object Publisher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snow-squall-live-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Prepare persistent live-data directories
        run: |
          mkdir -p viewer/data/live data/derived

      - name: Process latest KCXX volume
        run: |
          python scripts/live_object_worker.py             --radar KCXX             --poll-seconds 2             --max-polls 1             --state viewer/data/live/KCXX_state.json             --output viewer/data/live/KCXX_objects.geojson             --history-jsonl viewer/data/live/KCXX_history.jsonl             --history-csv viewer/data/live/KCXX_history.csv

      - name: Process latest KTYX volume
        run: |
          python scripts/live_object_worker.py             --radar KTYX             --poll-seconds 2             --max-polls 1             --state viewer/data/live/KTYX_state.json             --output viewer/data/live/KTYX_objects.geojson             --history-jsonl viewer/data/live/KTYX_history.jsonl             --history-csv viewer/data/live/KTYX_history.csv

      - name: Build browser history payloads
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          cutoff = datetime.now(timezone.utc) - timedelta(days=7)
          max_rows = 15000

          for site in ("KCXX", "KTYX"):
              src = Path(f"viewer/data/live/{site}_history.jsonl")
              rows = []
              if src.exists():
                  for line in src.read_text(encoding="utf-8").splitlines():
                      try:
                          row = json.loads(line)
                          ts = datetime.fromisoformat(
                              str(row["timestamp"]).replace("Z", "+00:00")
                          ).astimezone(timezone.utc)
                          if ts >= cutoff:
                              rows.append(row)
                      except (KeyError, TypeError, ValueError, json.JSONDecodeError):
                          continue

              rows.sort(key=lambda r: r.get("timestamp", ""))
              rows = rows[-max_rows:]
              Path(f"viewer/data/live/{site}_history.json").write_text(
                  json.dumps(rows, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              print(site, "history rows:", len(rows))
          PY

      - name: Validate KCXX live product
        run: |
          python scripts/audit_operational_readiness.py             --state viewer/data/live/KCXX_state.json             --geojson viewer/data/live/KCXX_objects.geojson             --max-age-minutes 30
          python scripts/live_healthcheck.py             --state viewer/data/live/KCXX_state.json             --geojson viewer/data/live/KCXX_objects.geojson             --max-age-minutes 30

      - name: Validate KTYX live product
        run: |
          python scripts/audit_operational_readiness.py             --state viewer/data/live/KTYX_state.json             --geojson viewer/data/live/KTYX_objects.geojson             --max-age-minutes 30
          python scripts/live_healthcheck.py             --state viewer/data/live/KTYX_state.json             --geojson viewer/data/live/KTYX_objects.geojson             --max-age-minutes 30

      - name: Commit updated live data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/data/live
          if git diff --cached --quiet; then
            echo "No new live volume; nothing to publish."
            exit 0
          fi

          git commit -m "Update live snow squall object feeds"
          git fetch origin snow-squall-model-foundation
          git rebase origin/snow-squall-model-foundation
          git push origin HEAD:snow-squall-model-foundation
