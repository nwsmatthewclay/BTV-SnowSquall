name: Snow Squall Live Object Publisher
# Native-gate radar fallback enabled
# RAP cache downloads are process-isolated for parallel radar workers.

on:
  push:
    paths:
      - ".github/workflows/snow-squall-live-publisher.yml"
      - "scripts/live_object_worker.py"
      - "scripts/process_live_volume.py"
      - "acquisition/rap_environment.py"
      - "processing/rap_features.py"
      - "scripts/append_live_object_history.py"
      - "scripts/audit_operational_readiness.py"
      - "scripts/live_healthcheck.py"
      - "scripts/build_live_radar_mosaic.py"
      - "processing/object_detector.py"
      - "processing/object_tracker.py"
      - "requirements-science.txt"
  workflow_dispatch:

# The public archive watcher is now the scheduled live publisher. This workflow
# remains available for manual recovery/replay, but must not race the primary
# synchronized KCXX/KTYX event cycle.

permissions:
  contents: write

concurrency:
  group: snow-squall-live-object-publisher-v2
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation
          fetch-depth: 2

      - name: Restore prior live feed history
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin snow-squall-live-data >/dev/null 2>&1; then
            git fetch --no-tags origin snow-squall-live-data
            git checkout origin/snow-squall-live-data -- viewer/data/live || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Prepare persistent live-data directories
        run: |
          mkdir -p viewer/data/live data/derived

      - name: Process latest KCXX and KTYX volumes in parallel
        run: |
          set +e

          python scripts/live_object_worker.py \
            --radar KCXX \
            --poll-seconds 2 \
            --max-polls 1 \
            --max-volumes-per-run 2 \
            --prefer-latest \
            --state viewer/data/live/KCXX_state.json \
            --output viewer/data/live/KCXX_objects.geojson \
            --history-jsonl viewer/data/live/KCXX_history.jsonl \
            --history-csv data/derived/KCXX_history.csv > /tmp/kcxx-object-worker.log 2>&1 &
          KCXX_PID=$!

          python scripts/live_object_worker.py \
            --radar KTYX \
            --poll-seconds 2 \
            --max-polls 1 \
            --max-volumes-per-run 1 \
            --prefer-latest \
            --state viewer/data/live/KTYX_state.json \
            --output viewer/data/live/KTYX_objects.geojson \
            --history-jsonl viewer/data/live/KTYX_history.jsonl \
            --history-csv data/derived/KTYX_history.csv > /tmp/ktyx-object-worker.log 2>&1 &
          KTYX_PID=$!

          wait $KCXX_PID
          KCXX_RC=$?
          wait $KTYX_PID
          KTYX_RC=$?

          cat /tmp/kcxx-object-worker.log
          cat /tmp/ktyx-object-worker.log

          echo "KCXX object worker rc=$KCXX_RC"
          echo "KTYX object worker rc=$KTYX_RC"
          if [ "$KCXX_RC" -ne 0 ] || [ "$KTYX_RC" -ne 0 ]; then
            exit 1
          fi

      - name: Normalize persisted live timestamps
        run: |
          python scripts/normalize_live_products.py --root viewer/data/live

      - name: Build bounded browser history payloads
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          cutoff = datetime.now(timezone.utc) - timedelta(days=7)
          max_rows = 15000

          for site in ("KCXX", "KTYX"):
              src = Path(f"viewer/data/live/{site}_history.jsonl")
              rows = []
              if src.exists():
                  for line in src.read_text(encoding="utf-8").splitlines():
                      try:
                          row = json.loads(line)
                          ts = datetime.fromisoformat(
                              str(row["timestamp"]).replace("Z", "+00:00")
                          ).astimezone(timezone.utc)
                          if ts >= cutoff:
                              rows.append(row)
                      except (KeyError, TypeError, ValueError, json.JSONDecodeError):
                          continue

              rows.sort(key=lambda r: r.get("timestamp", ""))
              rows = rows[-max_rows:]

              src.write_text(
                  "\n".join(
                      json.dumps(row, separators=(",", ":"))
                      for row in rows
                  ) + ("\n" if rows else ""),
                  encoding="utf-8",
              )
              Path(f"viewer/data/live/{site}_history.json").write_text(
                  json.dumps(rows, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              print(site, "history rows:", len(rows))
          PY

      - name: Restore newest standalone radar products before publication
        run: |
          set -euo pipefail
          git fetch --no-tags origin snow-squall-live-data

          # The standalone radar publisher owns these files. The object
          # publisher must carry its newest radar forward rather than rebuild
          # an older local mosaic and then fail the freshness gate.
          git checkout origin/snow-squall-live-data -- \
            viewer/data/live/radar_mosaic.json \
            viewer/data/live/radar_mosaic.png \
            viewer/data/live/radar_mosaic_clean.png \
            viewer/data/live/radar_mosaic_raw.png \
            viewer/data/live/radar_cursor.json \
            viewer/data/live/KCXX_base_reflectivity_clean.png \
            viewer/data/live/KCXX_base_reflectivity_raw.png \
            viewer/data/live/KCXX_base_velocity_clean.png \
            viewer/data/live/KCXX_base_velocity_raw.png \
            viewer/data/live/KTYX_base_reflectivity_clean.png \
            viewer/data/live/KTYX_base_reflectivity_raw.png \
            viewer/data/live/KTYX_base_velocity_clean.png \
            viewer/data/live/KTYX_base_velocity_raw.png

          rm -rf viewer/data/live/radar_history
          mkdir -p viewer/data/live/radar_history
          git archive origin/snow-squall-live-data viewer/data/live/radar_history | tar -x -C /tmp
          cp -R /tmp/viewer/data/live/radar_history/. viewer/data/live/radar_history/
          rm -rf /tmp/viewer

      - name: Validate live object products without blocking fresh radar
        run: |
          set +e
          python scripts/audit_operational_readiness.py --state viewer/data/live/KCXX_state.json --geojson viewer/data/live/KCXX_objects.geojson --max-age-minutes 30
          kcxx_rc=$?
          python scripts/live_healthcheck.py --state viewer/data/live/KCXX_state.json --geojson viewer/data/live/KCXX_objects.geojson --max-age-minutes 30 > viewer/data/live/KCXX_health.json
          python scripts/audit_operational_readiness.py --state viewer/data/live/KTYX_state.json --geojson viewer/data/live/KTYX_objects.geojson --max-age-minutes 30
          ktyx_rc=$?
          python scripts/live_healthcheck.py --state viewer/data/live/KTYX_state.json --geojson viewer/data/live/KTYX_objects.geojson --max-age-minutes 30 > viewer/data/live/KTYX_health.json
          echo "KCXX object validation rc=$kcxx_rc"
          echo "KTYX object validation rc=$ktyx_rc"
          echo "Object freshness is advisory here; radar freshness is validated separately below."

      - name: Confirm standalone radar metadata is present
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("viewer/data/live/radar_mosaic.json").read_text(encoding="utf-8"))
          sources=payload.get("sources") or []
          if not sources:
              raise SystemExit("No standalone radar metadata available.")
          print("Standalone radar retained:", [(s.get("radar"),s.get("scan_time_utc")) for s in sources])
          PY

      - name: Preserve newer standalone radar publication
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin snow-squall-live-data >/dev/null 2>&1; then
            exit 0
          fi

          git fetch --no-tags origin snow-squall-live-data
          use_remote="$(python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          def newest(path):
              try:
                  payload=json.loads(Path(path).read_text(encoding="utf-8"))
                  values=[]
                  for item in payload.get("sources",[]):
                      raw=item.get("scan_time_utc")
                      if raw:
                          values.append(datetime.fromisoformat(str(raw).replace("Z","+00:00")).astimezone(timezone.utc))
                  return max(values) if values else None
              except Exception:
                  return None

          local=newest("viewer/data/live/radar_mosaic.json")
          remote_raw=__import__("subprocess").check_output([
              "git","show","origin/snow-squall-live-data:viewer/data/live/radar_mosaic.json"
          ],text=True)
          remote_path=Path("/tmp/remote_radar_mosaic.json")
          remote_path.write_text(remote_raw,encoding="utf-8")
          remote=newest(remote_path)
          print("yes" if remote and (not local or remote > local) else "no")
          if local:
              print("local radar:",local.isoformat())
          if remote:
              print("remote radar:",remote.isoformat())
          PY
          )"

          if [ "$use_remote" != "yes" ]; then
            echo "Local radar is at least as new as the standalone publication."
            exit 0
          fi

          echo "Standalone radar publication is newer; restoring its radar products before final object publish."
          git archive origin/snow-squall-live-data \\
            viewer/data/live/radar_history \\
            viewer/data/live/radar_mosaic.json \\
            viewer/data/live/radar_mosaic.png \\
            viewer/data/live/radar_mosaic_clean.png \\
            viewer/data/live/radar_mosaic_raw.png \\
            viewer/data/live/radar_cursor.json \\
            viewer/data/live/KCXX_base_reflectivity_clean.png \\
            viewer/data/live/KCXX_base_reflectivity_raw.png \\
            viewer/data/live/KCXX_base_velocity_clean.png \\
            viewer/data/live/KCXX_base_velocity_raw.png \\
            viewer/data/live/KTYX_base_reflectivity_clean.png \\
            viewer/data/live/KTYX_base_reflectivity_raw.png \\
            viewer/data/live/KTYX_base_velocity_clean.png \\
            viewer/data/live/KTYX_base_velocity_raw.png \\
            > /tmp/standalone-radar.tar
          tar -xf /tmp/standalone-radar.tar -C .

      - name: Publish isolated live-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/snow-squall-live-payload
          cp -R viewer/data/live/. /tmp/snow-squall-live-payload/

          git checkout --orphan snow-squall-live-data
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p viewer/data/live
          cp -R /tmp/snow-squall-live-payload/. viewer/data/live/
          git add viewer/data/live

          if git diff --cached --quiet; then
            echo "No live data changes; nothing to publish."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update live snow squall object feeds"
          git push --force origin HEAD:snow-squall-live-data

# Live publisher follows the model-foundation branch.\n# Scheduled at minutes 2,7,12,... to reduce top-of-hour Actions scheduling contention.
# Live refresh heartbeat: 2026-10-05T18:15Z — chronological multi-scan tracking enabled

# Health validation verification: use the current model-branch live contract.
