name: Snow Squall Live Object Publisher
# Native-gate radar fallback enabled
# RAP cache downloads are process-isolated for parallel radar workers.

on:
  # Manual recovery/replay only. The synchronized public archive publisher
  # owns scheduled live publication now, preventing duplicate object cycles.
  workflow_dispatch:

# The public archive watcher is now the scheduled live publisher. This workflow
# remains available for manual recovery/replay, but must not race the primary
# synchronized KCXX/KTYX event cycle.

permissions:
  contents: write

concurrency:
  group: snow-squall-live-data-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation
          fetch-depth: 2

      - name: Restore prior live feed history
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin snow-squall-live-data >/dev/null 2>&1; then
            git fetch --no-tags origin snow-squall-live-data
            git checkout origin/snow-squall-live-data -- viewer/data/live || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Prepare persistent live-data directories
        run: |
          mkdir -p viewer/data/live data/derived

      - name: Process latest KCXX and KTYX volumes in parallel
        run: |
          set +e

          python scripts/live_object_worker.py \
            --radar KCXX \
            --poll-seconds 2 \
            --max-polls 1 \
            --max-volumes-per-run 1 \
            --prefer-latest \
            --state viewer/data/live/KCXX_state.json \
            --output viewer/data/live/KCXX_objects.geojson \
            --history-jsonl viewer/data/live/KCXX_history.jsonl \
            --history-csv data/derived/KCXX_history.csv > /tmp/kcxx-object-worker.log 2>&1 &
          KCXX_PID=$!

          python scripts/live_object_worker.py \
            --radar KTYX \
            --poll-seconds 2 \
            --max-polls 1 \
            --max-volumes-per-run 1 \
            --prefer-latest \
            --state viewer/data/live/KTYX_state.json \
            --output viewer/data/live/KTYX_objects.geojson \
            --history-jsonl viewer/data/live/KTYX_history.jsonl \
            --history-csv data/derived/KTYX_history.csv > /tmp/ktyx-object-worker.log 2>&1 &
          KTYX_PID=$!

          wait $KCXX_PID
          KCXX_RC=$?
          wait $KTYX_PID
          KTYX_RC=$?

          cat /tmp/kcxx-object-worker.log
          cat /tmp/ktyx-object-worker.log

          echo "KCXX object worker rc=$KCXX_RC"
          echo "KTYX object worker rc=$KTYX_RC"
          if [ "$KCXX_RC" -ne 0 ] || [ "$KTYX_RC" -ne 0 ]; then
            exit 1
          fi

      - name: Normalize persisted live timestamps
        run: |
          python scripts/normalize_live_products.py --root viewer/data/live

      - name: Build bounded browser history payloads
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          cutoff = datetime.now(timezone.utc) - timedelta(days=7)
          max_rows = 15000

          for site in ("KCXX", "KTYX"):
              src = Path(f"viewer/data/live/{site}_history.jsonl")
              rows = []
              if src.exists():
                  for line in src.read_text(encoding="utf-8").splitlines():
                      try:
                          row = json.loads(line)
                          ts = datetime.fromisoformat(
                              str(row["timestamp"]).replace("Z", "+00:00")
                          ).astimezone(timezone.utc)
                          if ts >= cutoff:
                              rows.append(row)
                      except (KeyError, TypeError, ValueError, json.JSONDecodeError):
                          continue

              rows.sort(key=lambda r: r.get("timestamp", ""))
              rows = rows[-max_rows:]

              src.write_text(
                  "\n".join(
                      json.dumps(row, separators=(",", ":"))
                      for row in rows
                  ) + ("\n" if rows else ""),
                  encoding="utf-8",
              )
              Path(f"viewer/data/live/{site}_history.json").write_text(
                  json.dumps(rows, separators=(",", ":")) + "\n",
                  encoding="utf-8",
              )
              print(site, "history rows:", len(rows))
          PY

      - name: Restore newest standalone radar products before publication
        run: |
          set -euo pipefail
          git fetch --no-tags origin snow-squall-live-data

          # The standalone radar publisher owns these files. The object
          # publisher must carry its newest radar forward rather than rebuild
          # an older local mosaic and then fail the freshness gate.
          git checkout origin/snow-squall-live-data -- \
            viewer/data/live/radar_mosaic.json \
            viewer/data/live/radar_mosaic.png \
            viewer/data/live/radar_mosaic_clean.png \
            viewer/data/live/radar_mosaic_raw.png \
            viewer/data/live/radar_cursor.json \
            viewer/data/live/KCXX_base_reflectivity_clean.png \
            viewer/data/live/KCXX_base_reflectivity_raw.png \
            viewer/data/live/KCXX_base_velocity_clean.png \
            viewer/data/live/KCXX_base_velocity_raw.png \
            viewer/data/live/KTYX_base_reflectivity_clean.png \
            viewer/data/live/KTYX_base_reflectivity_raw.png \
            viewer/data/live/KTYX_base_velocity_clean.png \
            viewer/data/live/KTYX_base_velocity_raw.png

          rm -rf viewer/data/live/radar_history
          mkdir -p viewer/data/live/radar_history
          git archive origin/snow-squall-live-data viewer/data/live/radar_history | tar -x -C /tmp
          cp -R /tmp/viewer/data/live/radar_history/. viewer/data/live/radar_history/
          rm -rf /tmp/viewer

      - name: Keep standalone radar publication authoritative
        run: |
          # Radar runs independently of the slower object tracker. Do not
          # rebuild a local mosaic from historical catch-up scans here: that
          # previously overwrote the fresh live mosaic and failed the job.
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("viewer/data/live/radar_mosaic.json")
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              print(f"WARNING: standalone radar metadata unavailable ({exc}); object publish continues.")
              raise SystemExit(0)

          sources = payload.get("sources") or []
          if payload.get("status") != "ready" or not sources:
              print("WARNING: standalone radar metadata is not ready; object publish continues.")
              raise SystemExit(0)

          now = datetime.now(timezone.utc)
          ages = []
          for source in sources:
              raw = source.get("scan_time_utc")
              if not raw:
                  print(f"WARNING: missing scan timestamp for {source.get('radar')}.")
                  continue
              stamp = datetime.fromisoformat(str(raw).replace("Z", "+00:00"))
              if stamp.tzinfo is None:
                  stamp = stamp.replace(tzinfo=timezone.utc)
              age = (now - stamp.astimezone(timezone.utc)).total_seconds() / 60
              ages.append(age)
              print(f"{source.get('radar')}: preserved scan={stamp.isoformat()} age={age:.1f} min")

          if not ages or max(ages) > 12:
              print("WARNING: standalone radar is aging; the independent radar watchdog handles recovery.")
          else:
              print("Standalone radar mosaic preserved; object publication continues independently.")
          PY

      - name: Validate live object products without blocking fresh radar
        run: |
          set +e
          python scripts/audit_operational_readiness.py --state viewer/data/live/KCXX_state.json --geojson viewer/data/live/KCXX_objects.geojson --max-age-minutes 30
          kcxx_rc=$?
          python scripts/live_healthcheck.py --state viewer/data/live/KCXX_state.json --geojson viewer/data/live/KCXX_objects.geojson --max-age-minutes 30 > viewer/data/live/KCXX_health.json
          python scripts/audit_operational_readiness.py --state viewer/data/live/KTYX_state.json --geojson viewer/data/live/KTYX_objects.geojson --max-age-minutes 30
          ktyx_rc=$?
          python scripts/live_healthcheck.py --state viewer/data/live/KTYX_state.json --geojson viewer/data/live/KTYX_objects.geojson --max-age-minutes 30 > viewer/data/live/KTYX_health.json
          echo "KCXX object validation rc=$kcxx_rc"
          echo "KTYX object validation rc=$ktyx_rc"
          echo "Object freshness is advisory here; radar freshness is validated separately below."

      - name: Publish object products without overwriting radar frames
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/viewer/data/live"
          payload_root="/tmp/snow-squall-object-payload"
          target_root="/tmp/snow-squall-object-publish"
          rm -rf "$payload_root" "$target_root"
          mkdir -p "$payload_root"

          # Object tracking owns only these files. Radar images, mosaic
          # metadata, base moments, cursor data, and radar_history are owned
          # by the independent radar-frame publisher and must never be
          # force-pushed by this workflow.
          for site in KCXX KTYX; do
            for suffix in state.json objects.geojson history.jsonl history.json health.json state.previous_reflectivity.npz; do
              name="${site}_${suffix}"
              if [ -s "$source_root/$name" ]; then
                cp "$source_root/$name" "$payload_root/$name"
              else
                echo "::warning::Object output missing or empty: $source_root/$name"
              fi
            done
          done

          test -s "$payload_root/KCXX_objects.geojson"
          test -s "$payload_root/KTYX_objects.geojson"

          git clone --no-tags --single-branch --branch snow-squall-live-data \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "$target_root"
          git -C "$target_root" config user.name "github-actions[bot]"
          git -C "$target_root" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Always start each attempt from the current remote head. If the
            # radar publisher wins a concurrent push, retry on its new head.
            git -C "$target_root" fetch --no-tags origin snow-squall-live-data
            git -C "$target_root" reset --hard origin/snow-squall-live-data

            for site in KCXX KTYX; do
              for suffix in state.json objects.geojson history.jsonl history.json health.json state.previous_reflectivity.npz; do
                name="${site}_${suffix}"
                if [ -s "$payload_root/$name" ]; then
                  cp "$payload_root/$name" "$target_root/viewer/data/live/$name"
                fi
              done
            done

            git -C "$target_root" add -- \
              viewer/data/live/KCXX_state.json \
              viewer/data/live/KCXX_objects.geojson \
              viewer/data/live/KCXX_history.jsonl \
              viewer/data/live/KCXX_history.json \
              viewer/data/live/KCXX_health.json \
              viewer/data/live/KCXX_state.previous_reflectivity.npz \
              viewer/data/live/KTYX_state.json \
              viewer/data/live/KTYX_objects.geojson \
              viewer/data/live/KTYX_history.jsonl \
              viewer/data/live/KTYX_history.json \
              viewer/data/live/KTYX_health.json \
              viewer/data/live/KTYX_state.previous_reflectivity.npz

            if git -C "$target_root" diff --cached --quiet; then
              echo "Object products are unchanged; nothing to publish."
              exit 0
            fi

            git -C "$target_root" commit -m "Publish fresh snow squall object feeds"
            if git -C "$target_root" push origin HEAD:snow-squall-live-data; then
              echo "Object feeds published without replacing radar-owned products (attempt $attempt)."
              exit 0
            fi
            echo "Live-data branch advanced during object publish; refreshing and retrying (attempt $attempt)."
            sleep 2
          done

          echo "Could not publish object feeds after three concurrent-update retries."
          exit 1

# Live publisher follows the model-foundation branch.\n# Scheduled at minutes 2,7,12,... to reduce top-of-hour Actions scheduling contention.
# Live refresh heartbeat: 2026-10-05T18:15Z — chronological multi-scan tracking enabled

# Health validation verification: use the current model-branch live contract.
