name: Snow Squall Expansion Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snow-squall-expansion-dataset.yml
      - .github/workflows/snow-squall-expansion-bootstrap.yml
      - .github/expansion-bootstrap-trigger
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-expansion:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch expansion workflow on foundation branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "status": "dispatching",
              "timestamp_utc": datetime.now(timezone.utc).isoformat(),
              "repository": os.environ["REPOSITORY"],
              "target_workflow": "snow-squall-expansion-dataset.yml",
              "target_ref": "snow-squall-model-foundation",
              "official_offset": 0,
              "unverified_offset": 0,
              "max_official": 30,
              "max_unverified": 15,
          }
          open("bootstrap_launch.json","w").write(json.dumps(payload, indent=2)+"\n")
          PY
          gh workflow run snow-squall-expansion-dataset.yml \
            --repo "$REPOSITORY" \
            --ref snow-squall-model-foundation \
            -f official_offset=0 \
            -f unverified_offset=0 \
            -f max_official=30 \
            -f max_unverified=15
          found=""
          for i in 1 2 3 4 5 6; do
            sleep 10
            found="$(gh run list --repo "$REPOSITORY" --workflow snow-squall-expansion-dataset.yml --branch snow-squall-model-foundation --limit 5 --json databaseId,status,conclusion,headBranch,url --jq '.[] | select(.status=="queued" or .status=="in_progress") | [.databaseId,.status,.conclusion,.headBranch,.url] | @tsv' | head -n 1 || true)"
            if [ -n "$found" ]; then
              echo "Target workflow observed: $found"
              break
            fi
          done
          export TARGET_RUN_OBSERVED="$found"
          python - <<'PY'
          import json
          p=json.load(open("bootstrap_launch.json"))
          p["status"]="dispatch_command_succeeded"
          p["target_run_observed"] = bool(os.environ.get("TARGET_RUN_OBSERVED"))
          p["target_run_observation"] = os.environ.get("TARGET_RUN_OBSERVED","")
          open("bootstrap_launch.json","w").write(json.dumps(p,indent=2)+"\n")
          PY
      - name: Upload bootstrap heartbeat
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-expansion-bootstrap-heartbeat
          path: bootstrap_launch.json
          retention-days: 14
