name: Snow Squall Research-Operational Candidate Gate

on:
  workflow_run:
    workflows:
      - Snow Squall Candidate Model Refresh
    types:
      - completed
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/candidate-gate-bootstrap-trigger
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: snow-squall-research-operational-candidate
  cancel-in-progress: false

jobs:
  gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - name: Resolve candidate model source
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          artifact_name=""
          source_mode=""

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
            source_name="${{ github.event.workflow_run.name }}"
            if [ "$source_name" = "Snow Squall Candidate Model Refresh" ]; then
              artifact_name="snow-squall-refreshed-model-bundles"
              source_mode="strict_refresh"
            fi
          fi

          if [ -z "$run_id" ] || [ -z "$artifact_name" ]; then
            refresh_run="$(gh run list --workflow "snow-squall-candidate-model-refresh.yml" --branch snow-squall-model-foundation --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)"
            if [ -n "$refresh_run" ] && [ "$refresh_run" != "null" ]; then
              run_id="$refresh_run"
              artifact_name="snow-squall-refreshed-model-bundles"
              source_mode="strict_refresh"
            fi
          fi

          if [ -z "$run_id" ] || [ -z "$artifact_name" ]; then
            expansion_run="$(gh run list --workflow "Snow Squall Expansion Dataset" --branch snow-squall-model-foundation --status success --limit 20 --json databaseId --jq '.[].databaseId' | head -n 1 || true)"
            test -n "$expansion_run" && test "$expansion_run" != "null"
            run_id="$expansion_run"
            artifact_name="snow-squall-live-model-bundles"
            source_mode="bootstrap_legacy_feature_contract"
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "source_mode=$source_mode" >> "$GITHUB_OUTPUT"
          echo "Using $source_mode from run $run_id"

      - name: Download candidate model package
        run: |
          set -euo pipefail
          rm -rf candidate_bundle
          gh run download "${{ steps.candidate.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "${{ steps.candidate.outputs.artifact_name }}" \
            --dir candidate_bundle

          if [ "${{ steps.candidate.outputs.source_mode }}" = "bootstrap_legacy_feature_contract" ]; then
            rm -rf bootstrap_features
            gh run download "${{ steps.candidate.outputs.run_id }}" \
              --repo "$GITHUB_REPOSITORY" \
              --name snow-squall-expansion-feature-batch \
              --dir bootstrap_features
            cp -R bootstrap_features/. candidate_bundle/

            for h in 15 30 45 60; do
              src="candidate_bundle/candidate_ensemble_expansion_${h}m"
              base="candidate_bundle/baseline_expansion_${h}m"
              test -f "${src}/metrics.json"
              test -f "${src}/baseline_model.joblib"
              test -f "${src}/probability_calibrator.joblib"
              rm -rf "candidate_bundle/candidate_ensemble_refresh_${h}m" "candidate_bundle/baseline_refresh_${h}m"
              cp -R "$src" "candidate_bundle/candidate_ensemble_refresh_${h}m"
              if [ -d "$base" ]; then cp -R "$base" "candidate_bundle/baseline_refresh_${h}m"; else cp -R "$src" "candidate_bundle/baseline_refresh_${h}m"; fi
            done

            cat > candidate_bundle/snow_squall_candidate_refresh_summary.json <<'JSON'
          {
            "release_status": "candidate_only_not_operational",
            "candidate_mode": "bootstrap_legacy_feature_contract",
            "bootstrap_source": "latest_successful_snow_squall_expansion_live_model_bundle",
            "training_contract_status": "legacy_feature_population_missing_first_class_base_moments",
            "note": "Bootstrap candidate is permitted only for research shadow scoring. Strict retraining remains required as soon as a complete radar/environment feature population is available."
          }
          JSON
          fi

          find candidate_bundle -maxdepth 4 -type f | sort

      - name: Locate candidate model root and schema
        id: locate
        run: |
          set -euo pipefail
          model_root="$(find candidate_bundle -type d -name 'candidate_ensemble_refresh_15m' -print -quit | xargs -r dirname)"
          schema="$(find candidate_bundle -type f -name 'snow_squall_model_features_expanded.schema.json' -print -quit)"
          features="$(find candidate_bundle -type f -name 'snow_squall_model_features_cumulative.csv' -print -quit)"
          test -n "$model_root"
          test -n "$schema"
          test -n "$features"
          echo "model_root=$model_root" >> "$GITHUB_OUTPUT"
          echo "schema=$schema" >> "$GITHUB_OUTPUT"
          echo "features=$features" >> "$GITHUB_OUTPUT"
      - name: Install science dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Audit candidate package integrity and live compatibility
        run: |
          set -euo pipefail
          mkdir -p candidate_gate
          python scripts/audit_candidate_release.py             --schema "${{ steps.locate.outputs.schema }}"             --model-root "${{ steps.locate.outputs.model_root }}"             --prefix candidate_ensemble_refresh_             --output candidate_gate/candidate_release_audit.json

      - name: Run independent case-held-out gate
        run: |
          set -euo pipefail
          python scripts/train_case_heldout_models.py             "${{ steps.locate.outputs.features }}"             --output-dir candidate_gate/case_heldout_gate
          test -f candidate_gate/case_heldout_gate/metrics.json

      - name: Determine research-operational candidate status
        run: |
          set -euo pipefail
          summary="$(find candidate_bundle -name snow_squall_candidate_refresh_summary.json -type f -print -quit)"
          test -n "$summary"
          python scripts/audit_research_operational_candidate.py \
            --model-root "${{ steps.locate.outputs.model_root }}" \
            --candidate-audit candidate_gate/candidate_release_audit.json \
            --case-heldout-gate candidate_gate/case_heldout_gate/metrics.json \
            --candidate-summary "$summary" \
            --output candidate_gate/research_operational_candidate_status.json

      - name: Launch modern validation
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/workflows/snow-squall-modern-validation.yml/dispatches" \
            -f ref="snow-squall-model-foundation"; then
            echo "Dispatched modern validation from candidate gate."
          else
            echo "Modern validation dispatch is unavailable in this runner context; candidate gate remains valid."
          fi
      - name: Upload research-operational candidate package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-research-operational-candidate
          retention-days: 30
          path: |
            candidate_bundle/**/candidate_ensemble_refresh_*m/**
            candidate_bundle/snow_squall_candidate_refresh_summary.json
            candidate_bundle/snow_squall_live_model_compatibility_refresh.json
            candidate_gate/candidate_release_audit.json
            candidate_gate/case_heldout_gate/
            candidate_gate/research_operational_candidate_status.json
