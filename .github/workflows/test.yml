name: Snow Squall Tests

on:
  push:
    branches:
      - main
      - snow-squall-model-foundation
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-science.txt
      - name: Configure repository import path
        run: |
          echo "PYTHONPATH=\${GITHUB_WORKSPACE}" >> "\${GITHUB_ENV}"
          export PYTHONPATH="\${GITHUB_WORKSPACE}"
          python -c "import acquisition, processing, scripts; print('Repository imports OK')"
      - name: Run tests
        run: pytest -q
      - name: Initialize training-table smoke test
        run: python scripts/initialize_training_table.py
      - name: Validate repository foundation
        run: python scripts/validate_repository.py
