name: Snow Squall Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Initialize training-table smoke test
        run: python scripts/initialize_training_table.py
      - name: Validate repository foundation
        run: python scripts/validate_repository.py
