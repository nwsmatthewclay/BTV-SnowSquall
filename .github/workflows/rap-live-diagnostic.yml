name: RAP Live Environment Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/workflows/rap-live-diagnostic.yml
      - .github/rap-live-diagnostic-trigger
      - acquisition/rap_environment.py
      - processing/rap_features.py

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout model foundation
        uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install science dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Probe current RAP source
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import numpy as np
          import xarray as xr

          from acquisition.rap_environment import acquire_for_radar_time
          from processing.rap_features import FIELD_SPECS, _open_field, _dataset_valid_time, _nearest

          radar_time = datetime.now(timezone.utc)
          result = acquire_for_radar_time(radar_time, output_dir=Path("data/raw/RAP_DIAGNOSTIC"), max_age_minutes=180)
          if result is None:
              raise SystemExit("No RAP analysis available within 180 minutes.")

          match, path = result
          print("RAP URL:", match.url)
          print("RAP valid:", match.valid_time.isoformat())
          print("RAP age minutes:", match.age_minutes)
          print("RAP local path:", path)
          print("RAP size MB:", round(path.stat().st_size / 1024 / 1024, 2))

          lat, lon = 44.468, -73.15
          report = {
              "radar_time_utc": radar_time.isoformat(),
              "valid_time_utc": match.valid_time.isoformat(),
              "age_minutes": match.age_minutes,
              "url": match.url,
              "size_bytes": path.stat().st_size,
              "fields": {},
          }

          for name, (level_type, short_name, level) in FIELD_SPECS.items():
              item = {
                  "typeOfLevel": level_type,
                  "shortName": short_name,
                  "level": level,
              }
              try:
                  ds = _open_field(path, level_type, short_name, level)
                  item["data_vars"] = list(ds.data_vars)
                  item["coords"] = list(ds.coords)
                  item["valid_time"] = (
                      _dataset_valid_time(ds).isoformat()
                      if _dataset_valid_time(ds) else None
                  )
                  item["sample"] = _nearest(ds, lat, lon)
                  item["status"] = "ok"
              except Exception as exc:
                  item["status"] = "error"
                  item["error_type"] = type(exc).__name__
                  item["error"] = str(exc)
              report["fields"][name] = item

          Path("rap_live_diagnostic.json").write_text(
              json.dumps(report, indent=2, default=str) + "\n",
              encoding="utf-8",
          )

          for name, item in report["fields"].items():
              print(name, "=>", item)
          PY

      - name: Upload RAP diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rap-live-diagnostic
          path: |
            rap_live_diagnostic.json
            data/raw/RAP_DIAGNOSTIC/
