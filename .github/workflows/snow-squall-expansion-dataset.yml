          python scripts/audit_object_detection_quality.py             data/derived/snow_squall_expansion_objects.csv             --output data/derived/snow_squall_expansion_object_detection_audit.json

      - name: Persist successful historical acquisition state
        if: success()
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          STATE_BRANCH: snow-squall-model-foundation
        run: |
          set -euo pipefail

          selected_path="data/manifests/snow_squall_expansion/snow_squall_expansion_cases.csv"
          local_ids="$(mktemp)"
          merged_state="$(mktemp)"

          python - "$selected_path" > "$local_ids" <<'PY'
          import sys
          import pandas as pd
          selected = pd.read_csv(sys.argv[1])
          ids = sorted({
              str(x).strip()
              for x in selected.get("candidate_id", pd.Series(dtype="string")).dropna().astype(str)
              if str(x).strip()
          })
          for candidate_id in ids:
              print(candidate_id)
          print(f"Selected candidate IDs: {len(ids)}", file=sys.stderr)
          PY

          for attempt in $(seq 1 15); do
            echo "Persisting historical acquisition state (attempt $attempt/15)."

            remote="$(gh api \
              "/repos/$GITHUB_REPOSITORY/contents/.github/historical-downloader-state.json?ref=$STATE_BRANCH")"
            remote_sha="$(printf '%s' "$remote" | jq -r '.sha')"
            remote_content="$(printf '%s' "$remote" | jq -r '.content' | tr -d '\n' | base64 --decode)"

            python - "$remote_content" "$local_ids" "$merged_state" "\${{ github.run_id }}" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          remote_text, ids_path, output_path, run_id = sys.argv[1:]
          state = json.loads(remote_text) if remote_text.strip() else {}
          prior = {str(x).strip() for x in state.get("processed_candidate_ids", []) if str(x).strip()}
          selected = {line.strip() for line in Path(ids_path).read_text(encoding="utf-8").splitlines() if line.strip()}
          prior.update(selected)
          state.update({
              "version": 2,
              "source": state.get("source", "historical_expansion"),
              "processed_candidate_ids": sorted(prior),
              "last_successful_radar_qc_run_id": int(run_id),
              "last_successful_radar_qc_utc": datetime.now(timezone.utc).isoformat(),
          })
          Path(output_path).write_text(json.dumps(state, indent=2) + "\n", encoding="utf-8")
          print(f"Total processed candidate IDs: {len(prior)}")
          PY

            encoded="$(base64 -w0 "$merged_state")"
            if gh api --method PUT \
              "/repos/$GITHUB_REPOSITORY/contents/.github/historical-downloader-state.json" \
              -f message="Record historical radar acquisition state" \
              -f content="$encoded" \
              -f sha="$remote_sha" \
              -f branch="$STATE_BRANCH" \
              >/tmp/state_update_response.json 2>/tmp/state_update_error.txt; then
              echo "Historical acquisition state persisted successfully."
              jq -r '.commit.sha // "unknown"' /tmp/state_update_response.json | sed 's/^/State commit: /'
              rm -f "$local_ids" "$merged_state"
              exit 0
            fi

            echo "State update conflicted; another branch writer moved the ref. Retrying with fresh remote state."
            cat /tmp/state_update_error.txt || true
            sleep_seconds=$((attempt < 5 ? attempt : 5))
            sleep "$sleep_seconds"
          done

          rm -f "$local_ids" "$merged_state"
          echo "ERROR: unable to persist historical acquisition state after 15 attempts."