name: Snow Squall Expansion Dataset

on:
  workflow_run:
    workflows:
      - Snow Squall Unified Case Ledger
    types:
      - completed
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/expansion-trigger
  workflow_dispatch:
    inputs:
      official_offset:
        description: "Documented cases to skip for this batch"
        required: false
        default: "0"
        type: string
      unverified_offset:
        description: "Review candidates to skip for this batch"
        required: false
        default: "0"
        type: string
      max_official:
        description: "Documented cases in this batch"
        required: false
        default: "30"
        type: string
      max_unverified:
        description: "Review candidates in this batch"
        required: false
        default: "15"
        type: string


permissions:
  actions: read
  contents: read

concurrency:
  group: snow-squall-expansion-dataset-v2
  cancel-in-progress: true

jobs:
  expand:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout model foundation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Download unified case ledger artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: snow-squall-unified-case-ledger
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: discovery_artifact

      - name: Discover directly when no workflow artifact is provided
        if: github.event_name != 'workflow_run'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python scripts/discover_snow_squall_cases.py --config config/snow_squall_discovery.json --output-dir discovery_artifact
          python scripts/discover_iem_lsr_candidates.py --start-year 2002 --end-year 2026 --output-dir lsr_artifact
          python scripts/merge_snow_squall_case_sources.py --discovery discovery_artifact/snow_squall_candidates.csv --iem-lsr lsr_artifact/iem_lsr_case_clusters.csv --study data/manifests/banacos_2014_cases.csv --output-dir discovery_artifact/unified

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install science dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-science.txt

      - name: Locate unified ledger files
        id: ledger
        run: |
          set -euo pipefail
          ledger="$(find discovery_artifact -name snow_squall_case_ledger.csv -type f -print -quit)"
          radar="$(find discovery_artifact -name snow_squall_case_radar_manifest.csv -type f -print -quit)"
          test -n "$ledger"
          test -n "$radar"
          echo "ledger=$ledger" >> "$GITHUB_OUTPUT"
          echo "radar=$radar" >> "$GITHUB_OUTPUT"
          echo "Ledger: $ledger"
          echo "Radar manifest: $radar"

      - name: Inspect unified ledger size
        run: |
          python - <<'PY'
          import pandas as pd
          ledger=pd.read_csv('${{ steps.ledger.outputs.ledger }}')
          radar=pd.read_csv('${{ steps.ledger.outputs.radar }}')
          print('Unified case records:',len(ledger))
          print('Physical episodes:',ledger['episode_id'].nunique() if 'episode_id' in ledger else 'missing')
          print('Radar acquisition rows:',len(radar))
          print('Verification classes:')
          print(ledger['verification_class'].value_counts().to_string())
          PY

      - name: Select expanded documented and unverified case pool
        run: |
          set -euo pipefail
          rm -rf data/manifests/snow_squall_expansion
          python scripts/select_snow_squall_case_pool.py \
            --input "${{ steps.ledger.outputs.ledger }}" \
            --radar-manifest "${{ steps.ledger.outputs.radar }}" \
            --output-dir data/manifests/snow_squall_expansion \
            --max-official "${{ inputs.max_official || '30' }}" \
            --max-unverified "${{ inputs.max_unverified || '15' }}" \
            --offset-official "${{ inputs.official_offset || '0' }}" \
            --offset-unverified "${{ inputs.unverified_offset || '0' }}" \
            --exclude-modern-validation data/manifests/modern_independent_validation_cases.csv
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          root=Path('data/manifests/snow_squall_expansion')
          cases=pd.read_csv(root/'snow_squall_expansion_cases.csv')
          verified=cases[cases.verification_class.isin(['official_documented','official_plus_independent_report','official_plus_warning','official_plus_warning_and_report','official_plus_warning_verified','official_study_warning_verified','official_plus_study','study_verified','study_warning_verified'])].copy()
          unverified=cases[~cases.verification_class.isin(['official_documented','official_plus_independent_report','official_plus_warning','official_plus_warning_and_report','official_plus_warning_verified','official_study_warning_verified','official_plus_study','study_verified','study_warning_verified'])].copy()
          verified.to_csv(root/'snow_squall_verified_cases.csv',index=False)
          unverified.to_csv(root/'snow_squall_unverified_cases.csv',index=False)
          print('Verified cases:',len(verified))
          print('Unverified cases:',len(unverified))
          PY

      - name: Acquire ASOS/METAR observations
        run: |
          python acquisition/asos_iem.py \
            --cases data/manifests/snow_squall_expansion/snow_squall_expansion_cases.csv \
            --output data/raw/ASOS_IEM_expansion \
            --buffer-before 120 \
            --buffer-after 150

      - name: Audit expanded ASOS/METAR timing and visibility
        run: |
          python scripts/audit_surface_truth.py \
            --cases data/manifests/snow_squall_expansion/snow_squall_expansion_cases.csv \
            --surface-root data/raw/ASOS_IEM_expansion \
            --output data/derived/snow_squall_expansion_surface_truth.csv \
            --summary data/derived/snow_squall_expansion_surface_truth.json
      - name: Acquire expanded SWDI PLSR evidence
        run: |
          python scripts/acquire_swdi_plsr.py \
            --cases data/manifests/snow_squall_expansion/snow_squall_expansion_cases.csv \
            --output data/derived/snow_squall_expansion_plsr.csv \
            --status data/derived/snow_squall_expansion_plsr_status.json

      - name: Download expanded Level-II radar
        run: |
          python acquisition/historical_level2.py \
            --manifest data/manifests/snow_squall_expansion/snow_squall_expansion_radar_manifest.csv \
            --output data/raw/snow_squall_expansion_level2

      - name: Reconstruct documented and unverified radar objects
        run: |
          python scripts/reconstruct_pilot.py \
            --input data/raw/snow_squall_expansion_level2 \
            --output data/derived/snow_squall_expansion_objects.csv \
            --error-log data/derived/snow_squall_expansion_objects_errors.csv

      - name: Annotate reconstructed objects to candidate cases
        run: |
          python scripts/annotate_object_population.py \
            data/derived/snow_squall_expansion_objects.csv \
            --manifest data/manifests/snow_squall_expansion/snow_squall_expansion_radar_manifest.csv \
            --output data/derived/snow_squall_expansion_objects_annotated.csv

      - name: Attach discovery verification class
        run: |
          python - <<'PY'
          import pandas as pd
          objects=pd.read_csv('data/derived/snow_squall_expansion_objects_annotated.csv')
          cases=pd.read_csv('data/manifests/snow_squall_expansion/snow_squall_expansion_cases.csv')
          keep=['case_id','episode_id','candidate_source','verification_class','verification_status','event_start_utc','lat','lon','ncei_explicit_snow_squall','lsr_count','source_records','source_types']
          objects=objects.drop(columns=[c for c in keep[1:] if c in objects.columns],errors='ignore').merge(cases[keep],on='case_id',how='left',validate='many_to_one')
          objects.to_csv('data/derived/snow_squall_expansion_objects_tagged.csv',index=False)
          print(objects['verification_class'].value_counts(dropna=False).to_string())
          PY

      - name: Split documented and unverified populations
        run: |
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('data/derived/snow_squall_expansion_objects_tagged.csv')
          verified=d[d.verification_class.isin(['official_documented','official_plus_independent_report','official_plus_warning','official_plus_warning_and_report','official_plus_warning_verified','official_study_warning_verified','official_plus_study','study_verified','study_warning_verified'])].copy()
          unverified=d[~d.verification_class.isin(['official_documented','official_plus_independent_report','official_plus_warning','official_plus_warning_and_report','official_plus_warning_verified','official_study_warning_verified','official_plus_study','study_verified','study_warning_verified'])].copy()
          verified.to_csv('data/derived/snow_squall_verified_objects.csv',index=False)
          unverified.to_csv('data/derived/snow_squall_unverified_objects.csv',index=False)
          print('Verified object scans:',len(verified))
          print('Unverified object scans:',len(unverified))
          PY
      - name: Build case evidence scorecard
        run: |
          python scripts/build_case_evidence_scorecard.py \
            --cases data/manifests/snow_squall_expansion/snow_squall_expansion_cases.csv \
            --surface data/derived/snow_squall_expansion_surface_truth.csv \
            --objects data/derived/snow_squall_expansion_objects_tagged.csv \
            --radar data/manifests/snow_squall_expansion/snow_squall_expansion_radar_manifest.csv \
            --output data/derived/snow_squall_case_evidence_scorecard.csv
      - name: Freeze supervised positive training cohort
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          root=Path('data/manifests/snow_squall_expansion')
          score=pd.read_csv('data/derived/snow_squall_case_evidence_scorecard.csv')
          cases=pd.read_csv(root/'snow_squall_expansion_cases.csv')
          objects=pd.read_csv('data/derived/snow_squall_verified_objects.csv')

          eligible=set(score.loc[score['training_eligible'].fillna(False),'candidate_id'].dropna().astype(str))
          case_key=cases['candidate_id'].astype(str) if 'candidate_id' in cases.columns else cases['case_id'].astype(str)
          training_cases=cases[case_key.isin(eligible)].copy()
          review_cases=cases[~case_key.isin(eligible)].copy()
          training_object_ids=set(training_cases['case_id'].astype(str))
          training_objects=objects[objects['case_id'].astype(str).isin(training_object_ids)].copy()

          training_cases.to_csv(root/'snow_squall_training_cases.csv',index=False)
          review_cases.to_csv(root/'snow_squall_training_review_cases.csv',index=False)
          training_objects.to_csv('data/derived/snow_squall_training_objects.csv',index=False)

          print('Documented candidate cases:', len(cases))
          print('Supervised training cases:', len(training_cases))
          print('Withheld documented/review cases:', len(review_cases))
          print('Supervised radar object scans:', len(training_objects))
          assert len(training_cases) > 0, 'No cases passed the supervised evidence gate'
          PY

      - name: Build supervised historical environment and labels
        run: |
          python scripts/build_historical_dataset.py \
            data/derived/snow_squall_training_objects.csv \
            --cases data/manifests/snow_squall_expansion/snow_squall_training_cases.csv \
            --output data/derived/snow_squall_training_environment.csv \
            --rap-dir data/raw/RAP_expansion \
            --ruc-dir data/raw/RUC_expansion
          python scripts/label_historical_outcomes.py \
            data/derived/snow_squall_training_environment.csv \
            --cases data/manifests/snow_squall_expansion/snow_squall_training_cases.csv \
            --output data/derived/snow_squall_training_labeled.csv \
            --diagnostics-output data/derived/snow_squall_training_label_diagnostics.json

      - name: Build unverified research population with environment
        run: |
          python scripts/enrich_object_environment.py \
            data/derived/snow_squall_unverified_objects.csv \
            --output data/derived/snow_squall_unverified_environment.csv \
            --rap-dir data/raw/RAP_expansion \
            --ruc-dir data/raw/RUC_expansion

      - name: Build larger null population
        run: |
          mkdir -p data/manifests/snow_squall_expansion
          python scripts/build_null_window_manifest.py \
            --cases data/manifests/snow_squall_expansion/snow_squall_training_cases.csv \
            --start 2008-10-01T00:00:00Z \
            --end 2026-06-30T21:00:00Z \
            --sample-count 40 \
            --seed $((20260929 + ${{ inputs.official_offset || '0' }} + ${{ inputs.unverified_offset || '0' }})) \
            --radars KCXX KTYX \
            --output data/manifests/snow_squall_expansion/snow_squall_null_windows.csv
          python acquisition/historical_level2.py \
            --manifest data/manifests/snow_squall_expansion/snow_squall_null_windows.csv \
            --output data/raw/snow_squall_expansion_null_level2
          python scripts/reconstruct_pilot.py \
            --input data/raw/snow_squall_expansion_null_level2 \
            --output data/derived/snow_squall_expansion_null_objects.csv \
            --error-log data/derived/snow_squall_expansion_null_objects_errors.csv
          python scripts/annotate_object_population.py \
            data/derived/snow_squall_expansion_null_objects.csv \
            --manifest data/manifests/snow_squall_expansion/snow_squall_null_windows.csv \
            --output data/derived/snow_squall_expansion_null_objects_annotated.csv
          python scripts/enrich_object_environment.py \
            data/derived/snow_squall_expansion_null_objects_annotated.csv \
            --output data/derived/snow_squall_expansion_null_environment.csv \
            --rap-dir data/raw/RAP_expansion \
            --ruc-dir data/raw/RUC_expansion
          python scripts/classify_null_windows.py \
            data/derived/snow_squall_expansion_null_objects_annotated.csv \
            --manifest data/manifests/snow_squall_expansion/snow_squall_null_windows.csv \
            --output data/derived/snow_squall_expansion_null_activity.csv

      - name: Build unified expanded training dataset
        run: |
          python scripts/build_unified_object_dataset.py \
            data/derived/snow_squall_training_labeled.csv \
            data/derived/snow_squall_expansion_null_environment.csv \
            --null-activity data/derived/snow_squall_expansion_null_activity.csv \
            --output data/derived/snow_squall_object_population_expanded.csv \
            --dataset-version object_population_expanded_v2
          python scripts/build_model_features.py \
            data/derived/snow_squall_object_population_expanded.csv \
            --output data/derived/snow_squall_model_features_expanded.csv \
            --schema-output data/derived/snow_squall_model_features_expanded.schema.json

      - name: Audit expanded training dataset integrity
        run: |
          python scripts/audit_expansion_dataset.py \
            data/derived/snow_squall_model_features_expanded.csv \
            --schema data/derived/snow_squall_model_features_expanded.schema.json \
            --cases data/manifests/snow_squall_expansion/snow_squall_training_cases.csv \
            --output data/derived/snow_squall_expansion_dataset_audit.json

      - name: Locate latest national radar pretraining pool
        id: national
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow "National SQW Radar Pretraining Pool" --branch snow-squall-model-foundation --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            gh run download "$run_id" --name national-sqw-radar-pretraining-pool --dir national_pretrain_artifact || true
          fi
          root=""
          if [ -d national_pretrain_artifact ]; then
            root="$(find national_pretrain_artifact -type d -name 'national_sqw_weak_model_15m' -print -quit | xargs -r dirname)"
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"
          if [ -n "$root" ]; then
            cp -R "$root"/national_sqw_weak_model_*m data/derived/
          fi
          echo "National pretraining root: ${root:-none}"

      - name: Add national BTV-excluded radar prior features
        run: |
          set -euo pipefail
          input=data/derived/snow_squall_model_features_expanded.csv
          output=data/derived/snow_squall_model_features_expanded_augmented.csv
          summary=data/derived/snow_squall_national_pretraining_feature_summary.json
          if [ -n "${{ steps.national.outputs.root }}" ]; then
            python scripts/add_national_pretraining_features.py \
              --features "$input" \
              --model-root "${{ steps.national.outputs.root }}" \
              --output "$output" \
              --summary "$summary" \
              --schema data/derived/snow_squall_model_features_expanded.schema.json
          else
            cp "$input" "$output"
            printf '%s\n' '{"status":"national_pretraining_not_available"}' > "$summary"
          fi
          echo "Augmented feature file: $output"
      - name: Restore prior cumulative feature batch
        id: prior_features
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow "Snow Squall Expansion Dataset" --branch snow-squall-model-foundation --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          root=""
          if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
            gh run download "$run_id" --name snow-squall-expansion-feature-batch --dir prior_expansion || true
          fi
          if [ -d prior_expansion ]; then
            prior="$(find prior_expansion -name 'snow_squall_model_features_cumulative.csv' -type f -print -quit)"
            if [ -n "$prior" ]; then root="$prior"; fi
          fi
          echo "path=$root" >> "$GITHUB_OUTPUT"
          echo "Prior cumulative feature batch: ${root:-none}"

      - name: Merge cumulative expansion feature population
        run: |
          set -euo pipefail
          current=data/derived/snow_squall_model_features_expanded_augmented.csv
          cumulative=data/derived/snow_squall_model_features_cumulative.csv
          if [ -n "${{ steps.prior_features.outputs.path }}" ]; then
            python scripts/merge_expansion_feature_batches.py \
              --current "$current" \
              --prior "${{ steps.prior_features.outputs.path }}" \
              --output "$cumulative"
          else
            cp "$current" "$cumulative"
          fi
          python - <<'PY'
          import pandas as pd
          d=pd.read_csv('data/derived/snow_squall_model_features_cumulative.csv')
          print('Cumulative feature rows:', len(d))
          print('Unique object-timestep rows:', d['row_identity_key'].nunique() if 'row_identity_key' in d.columns else 'not-present')
          PY
      - name: Audit expanded model feature policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/derived/snow_squall_model_features_expanded.schema.json').read_text())
          assert s['future_information_policy']=='current_and_past_only'
          assert s['operational_predictor_columns']
          print('Predictors:',len(s['predictor_columns']))
          print('Operational/live-compatible:',len(s['operational_predictor_columns']))
          PY

      - name: Train expanded four-horizon candidate models
        run: |
          for h in 15 30 45 60; do
            python scripts/train_baseline_model.py \
              data/derived/snow_squall_model_features_cumulative.csv \
              --schema data/derived/snow_squall_model_features_expanded.schema.json \
              --target squall_onset_within_${h}m \
              --output-dir data/derived/baseline_expansion_${h}m
          done
          python scripts/summarize_baseline_horizons.py \
            --root data/derived \
            --output data/derived/snow_squall_expanded_horizon_summary.json

      - name: Train expanded ensemble candidate models
        run: |
          for h in 15 30 45 60; do
            python scripts/train_candidate_ensemble.py \
              data/derived/snow_squall_model_features_cumulative.csv \
              --schema data/derived/snow_squall_model_features_expanded.schema.json \
              --target squall_onset_within_${h}m \
              --output-dir data/derived/candidate_ensemble_expansion_${h}m
          done
      - name: Compare expanded research candidate models
        run: |
          python scripts/compare_candidate_models.py \
            --root data/derived \
            --output data/derived/snow_squall_candidate_model_comparison.json
      - name: Calibrate candidate model bundles
        run: |
          for h in 15 30 45 60; do
            python scripts/calibrate_model_bundle.py --model-dir data/derived/baseline_expansion_${h}m
            python scripts/calibrate_model_bundle.py --model-dir data/derived/candidate_ensemble_expansion_${h}m
          done

      - name: Write expansion summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          out=Path('data/derived/snow_squall_expansion_summary.json')
          cases=json.loads(Path('data/manifests/snow_squall_expansion/snow_squall_expansion_selection.json').read_text())
          summary={'selection':cases}
          for p in Path('data/derived').glob('baseline_expansion_*m/metrics.json'):
              m=json.loads(p.read_text())
              summary[p.parent.name]={'evaluation_status':m.get('evaluation_status'),'training_rows':m.get('training_rows'),'training_groups':m.get('training_groups'),'positive_case_groups':m.get('positive_case_group_count'),'metrics':m.get('metrics',{})}
          out.write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(summary,indent=2))
          PY

      - name: Write next automatic expansion batch state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          cases = pd.read_csv('data/manifests/snow_squall_expansion/snow_squall_expansion_cases.csv')
          strong = {
              'official_documented', 'official_plus_independent_report',
              'official_plus_warning', 'official_plus_warning_and_report',
              'official_plus_warning_verified', 'official_study_warning_verified',
              'official_plus_study', 'study_verified', 'study_warning_verified',
          }
          official_count = int(cases['verification_class'].isin(strong).sum())
          review_count = int((~cases['verification_class'].isin(strong)).sum())
          official_offset = int('${{ inputs.official_offset || '0' }}')
          review_offset = int('${{ inputs.unverified_offset || '0' }}')
          official_batch = int('${{ inputs.max_official || '30' }}')
          review_batch = int('${{ inputs.max_unverified || '15' }}')
          state = {
              'auto_continue': True,
              'batch_rows': {'official': official_count, 'review': review_count},
              'batch_size': {'official': official_batch, 'review': review_batch},
              'current_offsets': {'official': official_offset, 'review': review_offset},
              'next_official_offset': official_offset + official_count,
              'next_unverified_offset': review_offset + review_count,
              'max_automatic_official': 150,
              'max_automatic_unverified': 125,
          }
          Path('data/derived/next_expansion_batch.json').write_text(
              json.dumps(state, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(state, indent=2))
          PY
      - name: Upload cumulative expansion feature batch
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-expansion-feature-batch
          path: |
            data/derived/snow_squall_model_features_expanded_augmented.csv
            data/derived/snow_squall_model_features_cumulative.csv
            data/derived/snow_squall_model_features_expanded.schema.json
            data/derived/snow_squall_expansion_dataset_audit.json
            data/derived/snow_squall_national_pretraining_feature_summary.json
            data/derived/next_expansion_batch.json
            data/manifests/snow_squall_expansion/snow_squall_expansion_cases.csv
            data/manifests/snow_squall_expansion/snow_squall_verified_cases.csv
      - name: Upload lightweight live-model bundle
        uses: actions/upload-artifact@v4
        with:
          name: snow-squall-live-model-bundles
          path: |
            data/derived/baseline_expansion_*m
            data/derived/candidate_ensemble_expansion_*m
            data/derived/snow_squall_expanded_horizon_summary.json
            data/derived/snow_squall_candidate_model_comparison.json
