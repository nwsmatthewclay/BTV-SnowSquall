name: Object Dataset Pilot

on:
  workflow_dispatch:

jobs:
  dataset-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: snow-squall-model-foundation

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-science.txt

      - name: Configure repository imports
        run: |
          python -c "import acquisition, processing, scripts; print('Repository imports OK')"

      - name: Build five-case positive pilot manifest
        run: |
          python - <<'PY'
          import pandas as pd
          cases = [
              "BTV20040315",
              "BTV20050213",
              "BTV20060207",
              "BTV20060224",
              "BTV20101127",
          ]
          src = pd.read_csv("data/manifests/banacos_radar_windows.csv")
          out = src[src["case_id"].isin(cases)].copy()
          out.to_csv("data/manifests/banacos_positive_pilot.csv", index=False)
          print(out[["case_id", "radar_site", "window_start_utc", "event_start_utc"]].to_string(index=False))
          assert len(out) == 10
          PY

      - name: Build five-window null pilot manifest
        run: |
          python scripts/build_null_window_manifest.py --sample-count 5 --seed 42 --radars KCXX KTYX --output data/manifests/banacos_null_windows_pilot.csv

      - name: Download positive radar windows
        run: |
          python acquisition/historical_level2.py --manifest data/manifests/banacos_positive_pilot.csv --output data/raw/positive_level2

      - name: Download null radar windows
        run: |
          python acquisition/historical_level2.py --manifest data/manifests/banacos_null_windows_pilot.csv --output data/raw/null_level2

      - name: Reconstruct positive objects
        run: |
          python scripts/reconstruct_pilot.py --input data/raw/positive_level2 --output data/derived/positive_object_scans.csv

      - name: Reconstruct null objects
        run: |
          python scripts/reconstruct_pilot.py --input data/raw/null_level2 --output data/derived/null_object_scans.csv

      - name: Annotate positive case IDs
        run: |
          python scripts/annotate_object_population.py data/derived/positive_object_scans.csv --manifest data/manifests/banacos_positive_pilot.csv --output data/derived/positive_object_scans_annotated.csv

      - name: Annotate null IDs
        run: |
          python scripts/annotate_object_population.py data/derived/null_object_scans.csv --manifest data/manifests/banacos_null_windows_pilot.csv --output data/derived/null_object_scans_annotated.csv

      - name: Build positive historical dataset with multi-era environment
        run: |
          python scripts/build_historical_dataset.py data/derived/positive_object_scans_annotated.csv --output data/derived/positive_object_environment.csv --rap-dir data/raw/RAP --ruc-dir data/raw/RUC

      - name: Apply leakage-safe positive outcome labels
        run: |
          python scripts/label_historical_outcomes.py data/derived/positive_object_environment.csv --output data/derived/positive_object_labeled.csv

      - name: Enrich null population with multi-era environment
        run: |
          python scripts/enrich_object_environment.py data/derived/null_object_scans_annotated.csv --output data/derived/null_object_environment.csv --rap-dir data/raw/RAP --ruc-dir data/raw/RUC

      - name: Build track catalogs
        run: |
          python scripts/build_object_track_catalog.py data/derived/positive_object_scans_annotated.csv --output data/derived/positive_object_tracks.csv
          python scripts/build_object_track_catalog.py data/derived/null_object_scans_annotated.csv --output data/derived/null_object_tracks.csv

      - name: Build unified object dataset
        run: |
          python scripts/build_unified_object_dataset.py data/derived/positive_object_labeled.csv data/derived/null_object_environment.csv --output data/derived/object_population_pilot.csv

      - name: Audit unified dataset
        run: |
          python - <<'PY'
          import pandas as pd
          d = pd.read_csv("data/derived/object_population_pilot.csv")
          print("UNIFIED OBJECT RECORDS:", len(d))
          print("POPULATIONS:")
          print(d["population"].value_counts(dropna=False).to_string())
          print("ENVIRONMENT SOURCES:")
          print(d["environment_source"].value_counts(dropna=False).to_string())
          print("ENVIRONMENT STATUS:")
          print(d["environment_status"].value_counts(dropna=False).to_string())
          print("CASE IDs:", d["case_id"].nunique(dropna=True))
          print("NULL IDs:", d["null_id"].nunique(dropna=True))
          assert len(d) > 0
          assert set(d["population"].dropna()) == {"verified_case_context", "winter_null_candidate"}
          assert "future_information_policy" in d.columns
          PY

      - name: Build SOO-ready pilot report
        run: |
          python scripts/build_pilot_report.py \
            --positive data/derived/positive_object_labeled.csv \
            --null data/derived/null_object_environment.csv \
            --positive-tracks data/derived/positive_object_tracks.csv \
            --null-tracks data/derived/null_object_tracks.csv \
            --output data/derived/pilot_report.html

      - name: Run tests
        run: pytest -q

      - name: Upload object dataset pilot
        uses: actions/upload-artifact@v4
        with:
          name: object-population-pilot
          path: |
            data/manifests/banacos_positive_pilot.csv
            data/manifests/banacos_null_windows_pilot.csv
            data/derived/positive_object_scans.csv
            data/derived/positive_object_scans_annotated.csv
            data/derived/positive_object_environment.csv
            data/derived/positive_object_labeled.csv
            data/derived/positive_object_tracks.csv
            data/derived/null_object_scans.csv
            data/derived/null_object_scans_annotated.csv
            data/derived/null_object_environment.csv
            data/derived/null_object_tracks.csv
            data/derived/object_population_pilot.csv
            data/derived/pilot_report.html
            data/raw/NARR
            data/raw/RUC
            data/raw/RAP
