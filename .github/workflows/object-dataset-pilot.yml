concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Object Dataset Pilot

permissions:
  actions: write
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - snow-squall-model-foundation
    paths:
      - .github/pilot-trigger

jobs:
  dataset-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-science.txt

      - name: Configure repository imports
        run: |
          python -c "import acquisition, processing, scripts; print('Repository imports OK')"
          echo "Pilot checkout:"
          git rev-parse HEAD

      - name: Build 12-case positive diversity pilot manifest
        run: |
          python - <<'PY'
          import pandas as pd
          cases = [
              "BTV20020323",
              "BTV20030113",
              "BTV20030209",
              "BTV20031202",
              "BTV20040315",
              "BTV20041217",
              "BTV20050213",
              "BTV20060207",
              "BTV20060224",
              "BTV20070205",
              "BTV20090125",
              "BTV20101127",
          ]
          src = pd.read_csv("data/manifests/banacos_radar_windows.csv")
          out = src[src["case_id"].isin(cases)].copy()
          out.to_csv("data/manifests/banacos_positive_pilot.csv", index=False)
          print(out[["case_id", "radar_site", "window_start_utc", "event_start_utc"]].to_string(index=False))
          assert len(out) == 24
          assert set(out["case_id"]) == set(cases)
          PY

      - name: Build 12-window null pilot manifest
        run: |
          python scripts/build_null_window_manifest.py --sample-count 12 --seed 42 --start 2002-01-01T00:00:00Z --end 2011-12-31T21:00:00Z --radars KCXX KTYX --output data/manifests/banacos_null_windows_pilot.csv --require-level2

      - name: Audit manifest identity
        run: |
          python - <<'PY'
          import pandas as pd
          p = pd.read_csv("data/manifests/banacos_positive_pilot.csv")
          n = pd.read_csv("data/manifests/banacos_null_windows_pilot.csv")
          expected = {
              "BTV20020323",
              "BTV20030113",
              "BTV20030209",
              "BTV20031202",
              "BTV20040315",
              "BTV20041217",
              "BTV20050213",
              "BTV20060207",
              "BTV20060224",
              "BTV20070205",
              "BTV20090125",
              "BTV20101127",
          }
          assert set(p["case_id"]) == expected
          assert n["case_id"].fillna("").eq("").all()
          assert n["window_id"].notna().all()
          assert n["window_id"].is_unique
          assert n["null_id"].notna().all()
          print("Positive case IDs:", sorted(p["case_id"].unique()))
          print("Null IDs:", sorted(n["null_id"].unique()))
          PY

      - name: Acquire ASOS/METAR surface observations
        run: |
          python acquisition/asos_iem.py             --cases data/manifests/banacos_positive_pilot.csv             --output data/raw/ASOS_IEM             --buffer-before 120             --buffer-after 150

      - name: Audit modern validation candidate manifest
        run: |
          python scripts/audit_modern_validation_manifest.py data/manifests/modern_independent_validation_cases.csv --report data/derived/modern_validation_manifest_audit.json

      - name: Audit surface truth
        run: |
          python scripts/audit_surface_truth.py             --cases data/manifests/banacos_positive_pilot.csv             --surface-root data/raw/ASOS_IEM             --output data/derived/surface_truth_audit.csv             --summary data/derived/surface_truth_audit.json

      - name: Acquire SWDI preliminary Local Storm Reports
        run: |
          python scripts/acquire_swdi_plsr.py \
            --cases data/manifests/banacos_positive_pilot.csv \
            --output data/derived/swdi_plsr_candidates.csv \
            --status data/derived/swdi_plsr_status.json

      - name: Acquire NCEI Storm Events truth candidates
        run: |
          python scripts/acquire_ncei_storm_events.py --start-year 2002 --end-year 2011 --output data/derived/ncei_storm_events_candidates.csv

      - name: Audit NCEI Storm Events timing and site consistency
        run: |
          python scripts/audit_storm_event_timing.py --events data/derived/ncei_storm_events_candidates.csv --cases data/manifests/banacos_positive_pilot.csv --stations data/manifests/observing_stations.csv --output data/derived/ncei_storm_event_timing_audit.csv --summary data/derived/ncei_storm_event_timing_audit.json

      - name: Download positive radar windows
        run: |
          python acquisition/historical_level2.py --manifest data/manifests/banacos_positive_pilot.csv --output data/raw/positive_level2

      - name: Download null radar windows
        run: |
          python acquisition/historical_level2.py --manifest data/manifests/banacos_null_windows_pilot.csv --output data/raw/null_level2

      - name: Audit positive Level-II window coverage
        run: |
          python scripts/audit_radar_window_coverage.py \\
            data/manifests/banacos_positive_pilot.csv \\
            data/raw/positive_level2 \\
            --report data/derived/positive_level2_window_coverage.json \\
            --min-fraction 0.90

      - name: Audit null Level-II window coverage
        run: |
          python scripts/audit_radar_window_coverage.py \\
            data/manifests/banacos_null_windows_pilot.csv \\
            data/raw/null_level2 \\
            --report data/derived/null_level2_window_coverage.json \\
            --min-fraction 0.75

      - name: Audit native Level-II fields
        run: |
          python scripts/audit_level2_fields.py --input data/raw/positive_level2 --output data/derived/positive_level2_field_audit.json --limit 40
          python scripts/audit_level2_fields.py --input data/raw/null_level2 --output data/derived/null_level2_field_audit.json --limit 40

      - name: Reconstruct positive objects in parallel by radar
        run: |
          set -euo pipefail
          rm -f data/derived/positive_object_scans_KCXX.csv                 data/derived/positive_object_scans_KTYX.csv                 data/derived/positive_object_scans_KCXX_errors.csv                 data/derived/positive_object_scans_KTYX_errors.csv
          python scripts/reconstruct_pilot.py             --input data/raw/positive_level2/KCXX             --output data/derived/positive_object_scans_KCXX.csv             --error-log data/derived/positive_object_scans_KCXX_errors.csv > /tmp/reconstruct_positive_KCXX.log 2>&1 &
          p1=$!
          python scripts/reconstruct_pilot.py             --input data/raw/positive_level2/KTYX             --output data/derived/positive_object_scans_KTYX.csv             --error-log data/derived/positive_object_scans_KTYX_errors.csv > /tmp/reconstruct_positive_KTYX.log 2>&1 &
          p2=$!
          wait $p1
          wait $p2
          cat /tmp/reconstruct_positive_KCXX.log
          cat /tmp/reconstruct_positive_KTYX.log
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          frames = []
          errors = []
          for radar in ("KCXX", "KTYX"):
              frames.append(pd.read_csv(f"data/derived/positive_object_scans_{radar}.csv"))
              errors.append(pd.read_csv(
                  f"data/derived/positive_object_scans_{radar}_errors.csv"
              ))
          pd.concat(frames, ignore_index=True).to_csv(
              "data/derived/positive_object_scans.csv", index=False
          )
          pd.concat(errors, ignore_index=True).to_csv(
              "data/derived/positive_object_scans_errors.csv", index=False
          )
          print("Merged positive object rows:", sum(len(x) for x in frames))
          print("Merged positive reconstruction errors:", sum(len(x) for x in errors))
          PY



      - name: Reconstruct null objects in parallel by radar
        run: |
          set -euo pipefail
          rm -f data/derived/null_object_scans_KCXX.csv                 data/derived/null_object_scans_KTYX.csv                 data/derived/null_object_scans_KCXX_errors.csv                 data/derived/null_object_scans_KTYX_errors.csv
          python scripts/reconstruct_pilot.py             --input data/raw/null_level2/KCXX             --output data/derived/null_object_scans_KCXX.csv             --error-log data/derived/null_object_scans_KCXX_errors.csv > /tmp/reconstruct_null_KCXX.log 2>&1 &
          p1=$!
          python scripts/reconstruct_pilot.py             --input data/raw/null_level2/KTYX             --output data/derived/null_object_scans_KTYX.csv             --error-log data/derived/null_object_scans_KTYX_errors.csv > /tmp/reconstruct_null_KTYX.log 2>&1 &
          p2=$!
          wait $p1
          wait $p2
          cat /tmp/reconstruct_null_KCXX.log
          cat /tmp/reconstruct_null_KTYX.log
          python - <<'PY'
          import pandas as pd
          frames = []
          errors = []
          for radar in ("KCXX", "KTYX"):
              frames.append(pd.read_csv(f"data/derived/null_object_scans_{radar}.csv"))
              errors.append(pd.read_csv(
                  f"data/derived/null_object_scans_{radar}_errors.csv"
              ))
          pd.concat(frames, ignore_index=True).to_csv(
              "data/derived/null_object_scans.csv", index=False
          )
          pd.concat(errors, ignore_index=True).to_csv(
              "data/derived/null_object_scans_errors.csv", index=False
          )
          print("Merged null object rows:", sum(len(x) for x in frames))
          print("Merged null reconstruction errors:", sum(len(x) for x in errors))
          PY

      - name: Validate radar object geolocation
        run: |
          python - <<'PY'
          import pandas as pd

          bounds = {
              "lat_min": 40.0,
              "lat_max": 47.0,
              "lon_min": -79.0,
              "lon_max": -68.0,
          }

          for name in ("positive", "null"):
              d = pd.read_csv(f"data/derived/{name}_object_scans.csv")
              lat = pd.to_numeric(d["centroid_lat"], errors="coerce")
              lon = pd.to_numeric(d["centroid_lon"], errors="coerce")
              valid = lat.notna() & lon.notna()
              assert valid.any(), f"{name}: no finite object coordinates"
              bad = valid & (
                  (lat < bounds["lat_min"]) | (lat > bounds["lat_max"]) |
                  (lon < bounds["lon_min"]) | (lon > bounds["lon_max"])
              )
              print(f"{name}: {int(valid.sum())} finite coordinates; {int(bad.sum())} outside BTV-domain guard")
              assert not bad.any(), f"{name}: implausible radar geolocation detected"

          print("Radar object geolocation guard passed.")
          PY

      - name: Audit radar reconstruction
        run: |
          python - <<'PY'
          import pandas as pd
          for name in ("positive", "null"):
              path = f"data/derived/{name}_object_scans.csv"
              errors = f"data/derived/{name}_object_scans_errors.csv"
              d = pd.read_csv(path)
              e = pd.read_csv(errors)
              print(f"{name} object records:", len(d))
              print(f"{name} reader backends:")
              print(d["reader_backend"].value_counts(dropna=False).to_string())
              print(f"{name} failed volumes:", len(e))
              if not e.empty:
                  print(e["error_type"].value_counts().to_string())
          PY

      - name: Build radar reconstruction audits
        run: |
          python scripts/audit_radar_reconstruction.py             data/derived/positive_object_scans.csv             --errors data/derived/positive_object_scans_errors.csv             --input-root data/raw/positive_level2             --max-failure-rate 0.20             --report data/derived/positive_radar_reconstruction_audit.json
          python scripts/audit_radar_reconstruction.py             data/derived/null_object_scans.csv             --errors data/derived/null_object_scans_errors.csv             --input-root data/raw/null_level2             --max-failure-rate 0.20             --report data/derived/null_radar_reconstruction_audit.json

      - name: Annotate positive case IDs
        run: |
          python scripts/annotate_object_population.py data/derived/positive_object_scans.csv --manifest data/manifests/banacos_positive_pilot.csv --output data/derived/positive_object_scans_annotated.csv

      - name: Annotate null IDs
        run: |
          python scripts/annotate_object_population.py data/derived/null_object_scans.csv --manifest data/manifests/banacos_null_windows_pilot.csv --output data/derived/null_object_scans_annotated.csv

      - name: Audit pilot annotation identity
        run: |
          python - <<'PY'
          import pandas as pd
          expected = {
              "BTV20020323", "BTV20030113", "BTV20030209", "BTV20031202",
              "BTV20040315", "BTV20041217", "BTV20050213", "BTV20060207",
              "BTV20060224", "BTV20070205", "BTV20090125", "BTV20101127"
          }
          p = pd.read_csv("data/derived/positive_object_scans_annotated.csv")
          n = pd.read_csv("data/derived/null_object_scans_annotated.csv")
          observed = set(p["case_id"].dropna().astype(str))
          unexpected = observed - expected
          missing = expected - observed
          print("Positive observed case IDs:", sorted(observed))
          print("Positive object rows by case:")
          print(p.groupby("case_id").size().sort_index().to_string())
          print("Unexpected positive case IDs:", sorted(unexpected))
          print("Missing positive case IDs:", sorted(missing))
          print("Null case IDs populated:", int(n["case_id"].notna().sum()))
          print("Null IDs observed:", sorted(n["null_id"].dropna().astype(str).unique()))
          assert not unexpected
          assert not missing
          assert int(n["case_id"].notna().sum()) == 0
          assert n["population_id"].notna().all()
          PY

      - name: Build positive historical dataset with multi-era environment
        run: |
          python scripts/build_historical_dataset.py data/derived/positive_object_scans_annotated.csv --output data/derived/positive_object_environment.csv --rap-dir data/raw/RAP --ruc-dir data/raw/RUC

      - name: Audit positive environment attachment
        run: |
          python scripts/audit_environment_attachment.py data/derived/positive_object_environment.csv --report data/derived/positive_environment_audit.json

      - name: Apply leakage-safe positive outcome labels
        run: |
          python scripts/label_historical_outcomes.py             data/derived/positive_object_environment.csv             --output data/derived/positive_object_labeled.csv             --diagnostics-output data/derived/positive_event_association_diagnostics.json

      - name: Audit outcome label integrity
        run: |
          python - <<'PY'
          import pandas as pd
          d = pd.read_csv("data/derived/positive_object_labeled.csv")
          horizons = [15, 30, 45, 60]
          for h in horizons:
              target = f"squall_onset_within_{h}m"
              bad = d[target].eq(1) & ~d["track_event_associated"].fillna(False)
              assert not bad.any(), f"{target} contains unassociated positives"
          for left, right in zip(horizons, horizons[1:]):
              a = d[f"squall_onset_within_{left}m"]
              b = d[f"squall_onset_within_{right}m"]
              assert not (a.eq(1) & b.eq(0)).any(), f"{left}m onset is not cumulative into {right}m"
          print("Outcome label integrity checks passed.")
          PY

      - name: Enrich null population with multi-era environment
        run: |
          python scripts/enrich_object_environment.py data/derived/null_object_scans_annotated.csv --output data/derived/null_object_environment.csv --rap-dir data/raw/RAP --ruc-dir data/raw/RUC

      - name: Audit null environment attachment
        run: |
          python scripts/audit_environment_attachment.py data/derived/null_object_environment.csv --report data/derived/null_environment_audit.json

      - name: Audit null-window radar coverage
        run: |
          python scripts/audit_null_window_coverage.py             data/manifests/banacos_null_windows_pilot.csv             data/derived/null_object_scans_annotated.csv             --report data/derived/null_window_coverage.json             --min-fraction 0.75

      - name: Classify null-window activity
        run: |
          python scripts/classify_null_windows.py data/derived/null_object_scans_annotated.csv --output data/derived/null_window_activity.csv

      - name: Build track catalogs
        run: |
          python scripts/build_object_track_catalog.py data/derived/positive_object_scans_annotated.csv --output data/derived/positive_object_tracks.csv
          python scripts/build_object_track_catalog.py data/derived/null_object_scans_annotated.csv --output data/derived/null_object_tracks.csv

      - name: Build unified object dataset
        run: |
          python scripts/build_unified_object_dataset.py             data/derived/positive_object_labeled.csv             data/derived/null_object_environment.csv             --null-activity data/derived/null_window_activity.csv             --output data/derived/object_population_pilot.csv

      - name: Audit unified 12-case dataset
        run: |
          python - <<'PY'
          import pandas as pd
          d = pd.read_csv("data/derived/object_population_pilot.csv")
          expected = {
              "BTV20020323", "BTV20030113", "BTV20030209", "BTV20031202",
              "BTV20040315", "BTV20041217", "BTV20050213", "BTV20060207",
              "BTV20060224", "BTV20070205", "BTV20090125", "BTV20101127"
          }
          positive = set(
              d.loc[d["population"] == "verified_case_context", "case_id"]
              .dropna().astype(str)
          )
          null_case_values = d.loc[
              d["population"] == "winter_null_candidate", "case_id"
          ].dropna()
          print("UNIFIED OBJECT RECORDS:", len(d))
          print("POPULATIONS:")
          print(d["population"].value_counts(dropna=False).to_string())
          print("ENVIRONMENT SOURCES:")
          print(d["environment_source"].value_counts(dropna=False).to_string())
          print("ENVIRONMENT STATUS:")
          print(d["environment_status"].value_counts(dropna=False).to_string())
          print("POSITIVE CASE IDS:", sorted(positive))
          print("NULL CASE IDs populated:", len(null_case_values))
          print("NULL IDs:", sorted(d["null_id"].dropna().astype(str).unique()))
          assert positive == expected
          assert len(null_case_values) == 0
          assert "future_information_policy" in d.columns
          PY

      - name: Build leakage-safe model features
        run: |
          python scripts/build_model_features.py data/derived/object_population_pilot.csv \
            --output data/derived/object_model_features_pilot.csv \
            --schema-output data/derived/object_model_features_pilot.schema.json

      - name: Audit model feature policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          schema = json.loads(Path("data/derived/object_model_features_pilot.schema.json").read_text())
          required = {
              "track_age_min",
              "max_reflectivity_dbz_delta",
              "area_km2_rate_per_min",
              "motion_speed_kmh",
          }
          predictors = set(schema["predictor_columns"])
          blocked = set(schema["blocked_non_predictors"])
          targets = set(schema["target_columns"])
          blocked_prefixes = tuple(schema["blocked_prefixes"])
          print("Predictor columns:", len(predictors))
          print("Target columns:", len(targets))
          print("Future-information policy:", schema["future_information_policy"])
          assert schema["future_information_policy"] == "current_and_past_only"
          assert required <= predictors
          assert targets <= blocked | set()
          assert not predictors.intersection(blocked)
          assert not any(
              any(column.startswith(prefix) for prefix in blocked_prefixes)
              for column in predictors
          )
          PY

      - name: Audit realized feature coverage
        run: |
          python scripts/audit_feature_coverage.py             data/derived/object_model_features_pilot.csv             --schema schema/feature_schema.csv             --output data/derived/object_model_features_pilot.coverage.json

      - name: Train case-held-out baseline models
        run: |
          for horizon in 15 30 45 60; do
            python scripts/train_baseline_model.py               data/derived/object_model_features_pilot.csv               --schema data/derived/object_model_features_pilot.schema.json               --target squall_onset_within_${horizon}m               --output-dir data/derived/baseline_model_${horizon}m
          done

      - name: Summarize baseline horizon verification
        run: |
          python scripts/summarize_baseline_horizons.py --root data/derived --output data/derived/baseline_horizon_summary.json

      - name: Build release reproducibility manifest
        run: |
          python scripts/build_release_manifest.py \
            --output data/derived/release_manifest.json \
            --path data/manifests \
            --path data/derived/baseline_horizon_summary.json \
            --path data/derived/object_model_features_pilot.schema.json \
            --path data/derived/object_model_features_pilot.coverage.json \
            --path data/derived/positive_level2_window_coverage.json \
            --path data/derived/swdi_plsr_candidates.csv \
            --path data/derived/swdi_plsr_status.json \
            --path data/derived/ncei_storm_events_candidates.csv \
            --path data/derived/ncei_storm_event_timing_audit.json \
            --path data/derived/null_level2_window_coverage.json \
            --path data/derived/positive_event_association_diagnostics.json \
            --path data/derived/null_window_coverage.json \
            --path data/derived/positive_environment_audit.json \
            --path data/derived/null_environment_audit.json

      - name: Build event-level verification diagnostics
        run: |
          for horizon in 15 30 45 60; do
            python scripts/build_event_level_verification.py data/derived/baseline_model_${horizon}m/oof_predictions.csv --target squall_onset_within_${horizon}m --output data/derived/event_level_pilot_${horizon}m.json
          done

      - name: Audit training dataset
        run: |
          python scripts/audit_training_dataset.py             data/derived/object_model_features_pilot.csv

      - name: Render positive radar frames for viewer
        run: |
          python scripts/export_viewer_radar_frames.py             --manifest data/manifests/banacos_positive_pilot.csv             --input data/raw/positive_level2             --output-dir data/derived/viewer

      - name: Build historical viewer data package
        run: |
          python scripts/build_static_viewer.py             --objects data/derived/positive_object_labeled.csv             --cases data/manifests/banacos_positive_pilot.csv             --output-dir data/derived/viewer             --frames-root data/derived/viewer

      - name: Build operational replay readiness note
        run: |
          cat > data/derived/operational_replay_readiness.txt <<'EOF'
          Historical scans can be replayed through the same live processor one
          scan at a time. Probability scoring remains disabled until independent
          historical verification is complete.
          EOF

      - name: Build SOO-ready pilot report
        run: |
          python scripts/build_pilot_report.py \
            --positive data/derived/positive_object_labeled.csv \
            --null data/derived/null_object_environment.csv \
            --positive-tracks data/derived/positive_object_tracks.csv \
            --null-tracks data/derived/null_object_tracks.csv \
            --null-activity data/derived/null_window_activity.csv \
            --surface-audit data/derived/surface_truth_audit.csv \
            --surface-summary data/derived/surface_truth_audit.json \
            --positive-radar-audit data/derived/positive_radar_reconstruction_audit.json \
            --null-radar-audit data/derived/null_radar_reconstruction_audit.json \
            --baseline-root data/derived \
            --coverage data/derived/object_model_features_pilot.coverage.json \
            --positive-level2-fields data/derived/positive_level2_field_audit.json \
            --null-level2-fields data/derived/null_level2_field_audit.json \
            --positive-level2-coverage data/derived/positive_level2_window_coverage.json \
            --null-level2-coverage data/derived/null_level2_window_coverage.json \
            --positive-association data/derived/positive_event_association_diagnostics.json \
            --null-coverage data/derived/null_window_coverage.json \
            --positive-environment-audit data/derived/positive_environment_audit.json \
            --null-environment-audit data/derived/null_environment_audit.json \
            --output data/derived/pilot_report.html

      - name: Run tests
        run: pytest -q

      - name: Validate unscored live-product contract
        if: hashFiles('data/derived/live_tracker_state.json', 'data/derived/live_objects.geojson') != ''
        run: python scripts/audit_operational_readiness.py

      - name: Upload object dataset pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: object-population-pilot
          path: |
            data/manifests/banacos_positive_pilot.csv
            data/manifests/banacos_null_windows_pilot.csv
            data/derived/positive_object_scans.csv
            data/derived/positive_object_scans_errors.csv
            data/derived/positive_radar_reconstruction_audit.json
            data/derived/surface_truth_audit.csv
            data/derived/surface_truth_audit.json
            data/raw/ASOS_IEM/surface_download_manifest.csv
            data/raw/ASOS_IEM/surface_download_errors.csv
            data/derived/positive_object_scans_annotated.csv
            data/derived/positive_object_environment.csv
            data/derived/positive_object_labeled.csv
